name: Style guide

# Only the style guide and the things it reads. A plugin commit should not
# rebuild this site, and the products' fonts and theme.json are inputs here,
# so a change to those does need to.
on:
  pull_request:
    paths:
      - "products/styleguide/**"
      - "tools/generators/sync_styleguide_assets.py"
      - "tools/generators/generate_styleguide_typography.py"
      - "tools/generators/generate_styleguide_layout.py"
      - "tools/validators/validate_styleguide_typography.py"
      - "tools/validators/validate_styleguide_layout.py"
      - "tools/validators/validate_styleguide_button.py"
      - "products/wordpress/themes/axismundi/theme.json"
      - "products/wordpress/themes/axismundi/assets/fonts/**"
      - "products/wordpress/themes/axismundi/assets/styles/tokens.*.css"
      - "products/wordpress/themes/axismundi/assets/styles/icons.css"
      - "products/wordpress/plugins/axismundi-korean-font-provider/assets/**"
      - "index.html"
      - ".github/workflows/styleguide.yml"
  push:
    branches:
      - main
    paths:
      - "products/styleguide/**"
      - "tools/generators/sync_styleguide_assets.py"
      - "tools/generators/generate_styleguide_typography.py"
      - "tools/generators/generate_styleguide_layout.py"
      - "tools/validators/validate_styleguide_typography.py"
      - "tools/validators/validate_styleguide_layout.py"
      - "tools/validators/validate_styleguide_button.py"
      - "products/wordpress/themes/axismundi/theme.json"
      - "products/wordpress/themes/axismundi/assets/fonts/**"
      - "products/wordpress/themes/axismundi/assets/styles/tokens.*.css"
      - "products/wordpress/themes/axismundi/assets/styles/icons.css"
      - "products/wordpress/plugins/axismundi-korean-font-provider/assets/**"
      - "index.html"
      - ".github/workflows/styleguide.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: products/styleguide

      # --verify rather than a plain build: it refuses to regenerate the
      # committed typography CSS, so a hand-edit or an un-rebuilt data change
      # fails here instead of being quietly papered over by CI.
      - name: Prepare and verify
        working-directory: products/styleguide
        run: python bin/build.py --verify

      - name: Build site
        working-directory: products/styleguide
        run: bundle exec jekyll build

      # The artifact is the whole public site, not a copy of the repository.
      # Pages used to serve every tracked file from main, which put the corpus,
      # the atlas and the docs tree online as a side effect of how the build
      # worked rather than as a decision. Only what is built here is published.
      - name: Stage the Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r products/styleguide/_site _site/styleguide
          touch _site/.nojekyll

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: styleguide-site
          path: _site
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Separate job because deploy-pages claims the github-pages environment, and
  # a pull request must never claim it: the build above still runs on a PR, so
  # a broken site fails review rather than reaching the URL.
  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
