<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axismundi</title>
<link rel="canonical" href="https://jiwoon-kim.github.io/axismundi/styleguide/">
<meta http-equiv="refresh" content="0; url=styleguide/">
<!--
  The root of the Pages site. Everything published here is built by
  .github/workflows/styleguide.yml and served from an Actions artifact, so this
  page is the only file at the root and it exists to hand the URL to the style
  guide. It carries no stylesheet on purpose: it should render before the
  redirect fires, on a site whose CSS lives one directory down.
-->
<style>
  html { color-scheme: light dark; }
  body {
    margin: 0;
    min-block-size: 100dvh;
    display: grid;
    place-content: center;
    gap: 0.75rem;
    padding: 2rem;
    font-family: system-ui, sans-serif;
    line-height: 1.6;
    text-align: center;
  }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 500; }
  p { margin: 0; opacity: 0.75; }
</style>
</head>
<body>
  <h1>Axismundi</h1>
  <p>Material 3를 WordPress 블록 테마에 바인딩하는 설계 문서입니다.</p>
  <p><a href="styleguide/">Style Guide로 이동</a> · <a href="https://github.com/Jiwoon-Kim/axismundi">GitHub</a></p>
</body>
</html>
