[package]
name = "gui"
version = "0.1.0"
description = "Axismundi client GUI"
edition = "2024"

[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axismundi-jmap-core = { path = "../../core" }
url = "2"
# Tauri default features minus common-controls-v6.  That feature makes muda link
# comctl32 v6, which needs the side-by-side manifest tauri-build puts on the app
# binary; a test binary gets no such manifest and fails to start with
# STATUS_ENTRYPOINT_NOT_FOUND.  This shell has no native menu or tray, so the
# feature buys nothing here.  Restore it, and give up the IPC test, if one is added.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring-core = "1.1.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"
