<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Axismundi</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        const appearance = JSON.parse(localStorage.getItem("axismundi.appearance"));
        for (const key of ["brightness", "contrast", "accent", "mailBodyTheme", "interfaceLayout"]) {
          if (typeof appearance?.[key] === "string") {
            document.documentElement.dataset[key] = appearance[key];
          }
        }
      } catch { /* The stylesheet supplies defaults. */ }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
