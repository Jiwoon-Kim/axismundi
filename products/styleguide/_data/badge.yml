# Material 3 Badge.
#
# The Badge owns its visual box. Hosts own placement: NavigationItem publishes
# the icon-corner slot, while Tabs publishes its inline and stacked spacing.

meta:
  namespace: md.comp.badge
  table_revision: "2026-05-27T22:44:15.009106Z"
  included_token_count: 32
  deprecated_token_count: 0
  raw_evidence: products/wordpress/plugins/axismundi/docs/m3-token-tables/SOURCE-M3-BADGES-RAW.md

prose_sources:
  overview:
    source: https://m3.material.io/components/badges/overview
    statement: Badges have small and large variants and contain at most four label characters.
  guidelines:
    source: https://m3.material.io/components/badges/guidelines
    statement: Badges are inside another component; the host owns their placement.
  accessibility:
    source: https://m3.material.io/components/badges/accessibility
    statement: Badge information is announced after its navigation destination, not as an independent target.

variants:
  small:
    status: implemented
    content: none
