# Material 3 Carousel — the published specification.
#
# Sources: https://m3.material.io/components/carousel/overview
#          https://m3.material.io/components/carousel/specs
#          https://m3.material.io/components/carousel/guidelines
#          https://m3.material.io/components/carousel/accessibility
#          https://github.com/material-components/material-components-android/blob/master/docs/components/Carousel.md
# Figma: https://www.figma.com/design/ixQuHzVDPis0DYdaoMixyP/Material-3-Design-Kit--Community-?node-id=55594-2480
#
# Token evidence:
# products/wordpress/plugins/axismundi/docs/m3-token-tables/SOURCE-M3-CAROUSEL-RAW.md
#
# Four layouts are the stable API. The overview calls out six visual results,
# while Guidelines and Android group center-aligned hero under Hero and
# multi-aspect under Uncontained. Keeping those as constrained configurations
# preserves both descriptions without inventing six unrelated components.

meta:
  namespace: md.comp.carousel-item
  table_revision: "2026-05-27T22:44:15.009106Z"
  layouts: [ multi-browse, uncontained, hero, full-screen ]
  alignments: [ start, center ]
  scroll_behaviors: [ default, snap ]
  tokenized_elements: [ carousel-item ]
  container_token_group_published: false
  live_component_token_count: 26
  deprecated_component_token_count: 1
  skipped_related_system_token_count: 1
  deprecated_tokens:
    - token: md.comp.carousel-item.container.surface-tint-layer.color
      reason: >-
        Deprecated when tonal surfaces replaced surface-tint layers. The table
        directs implementations to use the desired surface role directly, which
        is the live container.color -> md.sys.color.surface row above.
  excluded_related_deprecated_tokens:
    - token: md.sys.color.surface-tint
      reason: >-
        This is the second skipped row in the captured table, but it is a system
        token rather than part of the md.comp.carousel-item namespace. It is
        counted here so the omission cannot be mistaken for a lost row.

anatomy:
  required_elements: [ container, carousel-item ]
  item_width_roles: [ large, medium, small ]
  item_width_is_dynamic: true
  item_text_optional: true
  item_text_should_be_brief: true

item:
  container_color_token: md.comp.carousel-item.container.color
  container_color_role: surface
  container_elevation_token: md.comp.carousel-item.container.elevation
  container_elevation: 0
  container_shadow_color_token: md.comp.carousel-item.container.shadow-color
  container_shadow_color_role: shadow
  container_shape_token: md.comp.carousel-item.container.shape
  container_shape_role: corner.extra-large
  # The prose resolves extra-large to 28dp. CSS must consume the published
  # shape token rather than restating the resolved literal.
  container_shape_resolved: 28
  widths:
    large:
      dynamic: true
      customizable_maximum: true
    medium:
      dynamic: true
    small:
      dynamic: true
      minimum: 40
      maximum: 56

# The table publishes item state tokens only. Carousel spacing is prose-owned
# and therefore belongs to project (--ax-*) layout properties when implemented.
states:
  enabled:
    elevation: 0
  hovered:
    elevation_token: md.comp.carousel-item.hover.container.elevation
    elevation: 1
    state_layer_color_token: md.comp.carousel-item.hover.state-layer.color
    state_layer_color_role: on-surface
    state_layer_opacity_token: md.comp.carousel-item.hover.state-layer.opacity
  focused:
    elevation_token: md.comp.carousel-item.focus.container.elevation
    elevation: 0
    state_layer_color_token: md.comp.carousel-item.focus.state-layer.color
    state_layer_color_role: on-surface
    state_layer_opacity_token: md.comp.carousel-item.focus.state-layer.opacity
    indicator_color_token: md.comp.carousel-item.focus.indicator.color
    indicator_color_role: secondary
    indicator_thickness_token: md.comp.carousel-item.focus.indicator.thickness
    indicator_thickness: 3
    indicator_outer_offset_token: md.comp.carousel-item.focus.indicator.outline.offset
    indicator_outer_offset: 2
  pressed:
    elevation_token: md.comp.carousel-item.pressed.container.elevation
    elevation: 0
    state_layer_color_token: md.comp.carousel-item.pressed.state-layer.color
    state_layer_color_role: on-surface
    state_layer_opacity_token: md.comp.carousel-item.pressed.state-layer.opacity
  disabled:
    color_token: md.comp.carousel-item.disabled.container.color
    color_role: surface
    elevation_token: md.comp.carousel-item.disabled.container.elevation
    elevation: 0
    opacity_token: md.comp.carousel-item.disabled.container.opacity
    opacity: 0.38

optional_outline:
  width_token: md.comp.carousel-item.with-outline.outline.width
  width: 1
  color_token: md.comp.carousel-item.with-outline.outline.color
  color_role: outline
  hover_color_token: md.comp.carousel-item.with-outline.hover.outline.color
  hover_color_role: outline
  focus_color_token: md.comp.carousel-item.with-outline.focus.outline.color
  focus_color_role: on-surface
  pressed_color_token: md.comp.carousel-item.with-outline.pressed.outline.color
  pressed_color_role: outline
  disabled_color_token: md.comp.carousel-item.with-outline.disabled.outline.color
  disabled_color_role: outline
  disabled_opacity_token: md.comp.carousel-item.with-outline.disabled.outline.opacity
  disabled_opacity: 0.12

layouts:
  multi-browse:
    visible_item_roles_at_minimum: [ large, medium, small ]
    alignment: vertically-centered
    padding_inline_leading: 16
    padding_inline_trailing: 16
    padding_block: 8
    gap: 8
    large_width: dynamic-or-user-set
    medium_width: dynamic
    small_width: dynamic-40-to-56
    recommended_scroll_behavior: snap
  uncontained:
    visible_item_roles: [ large ]
    alignment: vertically-centered
    padding_inline_leading: 16
    padding_inline_trailing: 0
    padding_inline_trailing_published_here: false
    padding_inline_trailing_provenance: >-
      Inferred from multi-aspect's "only leading padding" and the guideline that
      multi-aspect uses the same layout as Uncontained; the Uncontained
      measurement table itself publishes only leading padding.
    padding_block: 8
    gap: 8
    item_width: unresolved
    item_width_published: false
    item_width_owner: project-theme-layer
    recommended_scroll_behaviors: [ default, snap ]
    items_change_size: false
    trailing_items_may_be_partially_visible: true
  hero:
    alignment: vertically-centered
    padding_inline_leading: 16
    padding_inline_trailing: 16
    padding_block: 8
    gap: 8
    large_width: dynamic
    small_width: dynamic-40-to-56
    recommended_scroll_behavior: snap
    minimum_items_by_alignment:
      start: { large: 1, small: 1 }
      # Center alignment changes the minimum topology, not just presentation:
      # it adds a preview item at the leading edge.
      center: { large: 1, small: 2 }
  full-screen:
    visible_item_roles: [ large ]
    visible_item_count: 1
    alignment: centered
    padding_inline_leading: 0
    padding_inline_trailing: 0
    padding_block: 0
    gap: 16
    required_scroll_behavior: snap
    required_snap_target: container-edges
    preferred_orientation: vertical
    compact_and_medium_orientation: portrait-only

configurations:
  alignment:
    allowed: [ start, center ]
    default: start
    note: >-
      All layouts may be centered, but center alignment is structural for Hero:
      it adds a leading preview item and changes the minimum item topology.
  multi-aspect:
    allowed_layouts: [ uncontained ]
    use_only_when_source_items_have_different_widths: true
    minimum_aspect_ratio: "9:16"
    maximum_aspect_ratio: "16:9"

# These are constraints, not recommendations. Recording the forbidden cells is
# necessary because the axes above are not freely composable.
constraints:
  - combination: { layout: full-screen, scroll_behavior: default }
    allowed: false
    reason: Full-screen must snap and must not stop part-way through an item.
  - combination: { layout: multi-browse, scroll_behavior: default }
    allowed: false
    reason: Default free scrolling is published for Uncontained only.
  - combination: { layout: hero, scroll_behavior: default }
    allowed: false
    reason: Default free scrolling is published for Uncontained only.
  - combination: { layout: full-screen, window_size: compact-or-medium, orientation: landscape }
    allowed: false
    reason: Full-screen is portrait-only at compact and medium breakpoints.
  - combination: { configuration: multi-aspect, layout: not-uncontained }
    allowed: false
    reason: Multi-aspect is an Uncontained configuration.
  - combination: { window_size: compact, item_has_text: true, visible_item_count: greater-than-3 }
    allowed: false
    reason: Compact carousels with text show at most three items at once.

behavior:
  pressed_shape_change:
    published: true
    amount_published: false
  parallax:
    enabled_by_default: true
    amount_published: false
  dynamic_item_sizing:
    enabled_by_default: true
    algorithm_published: false
  scrolling:
    default:
      stops_anywhere: true
      allowed_layouts: [ uncontained ]
    snap:
      aligns_to_layout_grid: true
      recommended_layouts: [ multi-browse, hero ]
      required_layouts: [ full-screen ]
  pointer_drag:
    published_as_interaction: true
    web_mechanism: native-touch-scroll-and-enhanced-mouse-or-pen-drag
    drag_activation_threshold: 6
    drag_activation_threshold_published: false
    dragged_click_is_suppressed: true
    snap_suspended_while_dragging: true
    release_behavior: nearest-item-snap-for-snap-layouts
    note: >-
      The threshold is an Axismundi interaction policy, not an M3 value. Native
      touch scrolling remains the no-JavaScript path; pointer enhancement must
      not make dragging the only way to reach an item.
  # Reduced motion asks for one size, not for no size. An earlier version
  # removed the widths, which left flex-basis with nothing to resolve: the
  # advanced layouts fell back to the intrinsic width of an image and collapsed
  # to 31 and 49 pixels, the unrecognisable item the guidelines tell you to
  # avoid. The uniform size is the strategy's focal width. Multi-aspect is the
  # exception by definition -- a layout whose point is varying widths cannot
  # render them all the same -- so it keeps its own widths, unmasked.
  reduced_motion:
    parallax: false
    items_expand_in_view: false
    all_items_same_size: true
    uniform_size_source: strategy focal width, or the caller's for Uncontained
    multi_aspect_exception: keeps its various widths, masking removed
    items_reach_window_edges: true
    hero_small_item_partially_visible: true
    # This is the reusable baseline for every layout, not a separate decorative
    # mode: all advanced layouts must be able to fall back to uniform geometry.
    geometry_path: uniform-uncontained

accessibility:
  container:
    focusable: false
    accessible_name_required: true
    published_role_name: container
    web_role: group
    web_role_source: WAI-ARIA-APG-carousel-pattern
    aria_roledescription: carousel
    landmark_policy: >-
      Use group by default. Home alone contains four carousels, so making each
      one a region would create landmark noise. A product surface that warrants
      a landmark owns a named region around the shared Carousel.
  items:
    directly_actionable: true
    initial_focus: first-item
    label_includes_current_and_total: true
    wrapper_role: group
    wrapper_aria_roledescription: slide
    wrapper_label: current-and-total
    wrapper_label_wording: n-of-m
    wrapper_label_wording_published: false
    wrapper_label_is_injectable: true
    wrapper_label_note: >-
      M3 requires the current and total values; the wording is ours. A
      solidus is spoken as "slash", as "of", or not at all depending on
      the screen reader and the language, so the default follows APG's own
      carousel example and the formatter is a prop, for the same reason
      roleDescription is one.
    action_label: item-content-name
    action_host: native-link-or-button
    nested_controls: prohibited
    nested_controls_source: >-
      Cross-component rule: Carousel prohibits controls inside its container;
      Card accessibility supplies the general exclusion that a directly
      actionable surface cannot contain another action.
  keyboard:
    - keys: Tab or ArrowLeft / ArrowRight
      action: Move to the previous or next carousel item.
    - keys: ArrowUp / ArrowDown
      action: Leave the carousel and move to the adjacent page element.
    - keys: Space or Enter
      action: Activate the focused carousel item.
  skip_over_items:
    required: true
    mechanism: ArrowUp-or-ArrowDown-focuses-adjacent-page-control
  horizontal_scroll_alternative:
    required_on_vertically_scrolling_pages: true
    exception_layouts: [ full-screen ]
    without_header:
      control: Show all button
      padding: 4
      placement: below-carousel
    with_header:
      control: arrow icon button
      icon_button_size: 48
      header_alignment: leading
      full_list_repeats_header: true
      placement: same-row-as-header
  controls:
    inside_or_beside_carousel: prohibited
    allowed_placement: above-or-below

discrepancies:
  - subject: number of layouts
    overview: Six layouts, counting center-aligned hero and uncontained multi-aspect ratio separately.
    guidelines_and_android: Four layouts, treating those two as configurations.
    note: >-
      The public model uses four layout strategies plus constrained alignment and
      aspect configurations. This preserves the behavioral families and avoids a
      six-value enum whose members duplicate most of their contract.
  - subject: carousel container role
    prose: The carousel container has the "container" role.
    web_platform: ARIA defines no role named "container".
    note: >-
      Resolved against the WAI-ARIA APG Carousel pattern, which permits region
      or group according to the page information architecture. The shared
      component uses group because repeated Home carousels do not each warrant
      a landmark. It is named and carries aria-roledescription="carousel"; each
      non-focusable item wrapper is a named group described as a slide.
  - subject: Uncontained trailing padding
    prose: >-
      The Uncontained measurement table publishes leading padding only, while
      the multi-aspect configuration says it has only leading padding and uses
      the same layout as Uncontained.
    recorded_value: 0
    note: >-
      Zero is a traceable inference, not a directly published Uncontained row.
      Keep its provenance attached until a source publishes the trailing value.
  - subject: Uncontained item width
    prose: Items are a single size and do not change size while scrolling.
    published_values: No item-width row or content-sizing rule.
    note: >-
      Width remains unresolved and belongs to the project theme layer. Do not
      describe it as content-sized or as an M3 token without another source.
  - subject: dynamic sizing and parallax algorithms
    prose: Items resize and use parallax as they move through the carousel.
    published_values: No keyline equations, interpolation curve or parallax amount.
    note: >-
      M3 does not publish a web equation. The implementation adapts AndroidX
      Material 3's platform-neutral Arrangement and Keyline strategy from the
      pinned Apache-2.0 source revision. DOM measurement, scrolling, rendering
      and the web public API remain project-owned and must not be presented as
      M3 web component contracts.
  - subject: Tablet reference frames are one composition
    measured: >-
      Figma's Tablet Hero, Tablet Multi-browse and Tablet Center-aligned Hero
      are all 184, 184, 120 and 56.
    interpretation: >-
      The kit's Tablet variants converge all three layout choices onto the
      Multi-browse profile. A static design-kit frame cannot establish whether
      that convergence is an intentional responsive recommendation, an older
      policy, or duplicated specimen geometry, so the record does not call the
      Hero labels wrong.
    upstream_difference: >-
      AndroidX HEAD 2d794f97 read on 2026-10-10 and the pinned a0c645de
      revision both search Hero with a medium count of zero. Their Hero adds
      large items as maxItemWidth permits and keeps one small item, or two for
      centred Hero; it does not switch strategy to Multi-browse at a Tablet
      breakpoint.
    consequence: >-
      The Stylebook keeps one shared Tablet Figma row and labels all three
      variant names on it, while runtime Hero remains the AndroidX-derived Hero
      strategy. A product that wants the kit's Tablet convergence must choose
      MultiBrowseCarousel in its responsive composition; the Hero primitive
      must not silently change identity by viewport.
    status: recorded, with tests
  - subject: Hero tablet medium item
    published_anatomy: Hero names large and small items, with no medium item in its measurement table.
    measured_figma_profile: Tablet Hero contains large, large, medium and small items.
    implementation_choice: Preserve the shared Figma Tablet profile as a static regression fixture only.
    proof: >-
      Hero's arrangement is searched with a medium count of zero, so no
      preferred width can make it produce a medium item. This proves that the
      kit's Tablet convergence is not the output of the AndroidX Hero strategy;
      it does not prove why the kit chose that convergence. A test asserts the
      zero.
    note: >-
      The medium item is therefore a measured specimen role, not a runtime
      constant and not a claim that the published Hero anatomy has a medium item.
  - subject: Tablet runtime small widths differ by strategy input
    measured: >-
      At 568dp of item space and 8dp gaps, the Stylebook runtime produces Hero
      256 / 256 / 40, centred Hero 40 / 232 / 232 / 40, and Multi-browse
      186 / 186 / 121 / 51. The Figma Multi-browse fixture is instead
      184 / 184 / 120 / 56.
    cause: >-
      All strategies start from the same 40dp through 56dp Small range. Hero
      has no Medium and must fit two Large items, so arrangement fitting lowers
      Small to its 40dp floor. Multi-browse with preferredItemWidth 186 is only
      5dp over the available space after its Medium and gaps, so fitting lowers
      Small from 56dp to 51dp. Passing the Figma fixture's 184dp preferred Large
      width yields its exact 184 / 184 / 120 / 56 arrangement.
    consequence: >-
      Neither 40dp nor 56dp is a layout-specific default. They are the lower
      and upper bounds selected by arrangement fitting. A responsive
      composition may pass a different preferred width, but the primitive does
      not switch values at a Tablet breakpoint.
  - subject: Center-aligned hero large-to-small split
    status: resolved
    was: >-
      The runtime rendered 40 / 284 / 40 where the Figma frame is 56 / 252 / 56,
      and this entry used to call the frame an outlier because Flutter's
      flexWeights [1, 7, 1] give 40.44 / 283.11 / 40.44 for the same item space.
    cause: >-
      Upstream reads a missing preferred item width as "one large item fills the
      viewport, minus the space the small items need", which pushes the small
      item onto its 40dp floor. The specimen passed one to Multi-browse and not
      to Hero, which is also why Multi-browse's small was 56 and Hero's was 40.
    resolution: >-
      Given the large width its frame was drawn at, the ported algorithm returns
      the frame exactly: 316 and 56 for Hero, 56, 252 and 56 for the centred
      Hero. A test holds both. Flutter's sample weights describe the no-preferred
      -width case, so all three sources agree once fed the same input.
  - subject: Uncontained edge masking
    prose: >-
      Items are a single size, and uncontained is the one layout whose items
      need not be fully visible on-screen.
    reading: >-
      The uniform size is the slot, not a claim that nothing is masked. The
      guidelines video shows uncontained items shrinking at the container edge,
      AndroidX publishes an uncontained cutoff keyline, and Flutter exposes the
      floor as shrinkExtent beside an exact itemExtent.
    status: implemented
    note: >-
      The renderer's one layout list answered two questions, and uncontained
      needed opposite answers: masked like the others, but not forced to snap,
      because the guidelines publish it with both scrolling behaviours. The
      lists are now separate. The wiring is not a copy of the advanced path
      either: there the slot is the strategy's focal size, while uncontained
      keeps the caller's exact itemWidth, because its itemMainAxisSize is a
      stride with the spacing already folded in. A test holds that difference.
    multi_aspect: >-
      Masked like every other layout. It was briefly excluded on the grounds
      that varying widths leave no single stride to interpolate against, which
      confused a limit of the uniform arithmetic with a property of the layout:
      the guidelines call it the same layout as the uncontained carousel, with
      items of various sizes. Each item carries its own box and the centres are
      a running sum, which reduces to the uniform arithmetic when every box is
      the same. The keylines are built from the widest box, because the focal
      position has to be able to show the largest item whole; M3 publishes no
      equation for the varying-width case, so that choice is this project's.
  - subject: anchor keylines inside the container padding
    prose: >-
      Carousel items must be fully visible on-screen, except for the
      uncontained layout.
    defect: >-
      A scroll container clips at its padding box, so items mapped to the
      anchor keylines were painted in the 16dp strip as 10dp slivers past the
      small item: one more item than the composition has.
    resolution: >-
      An item resting on an anchor keyline is not painted at all. Clipping the
      track to its content box was tried first and was worse: it also sliced
      items still on their way out, taking up to 17dp off a pill that should
      have been whole, so an item is now either on stage or not painted.
    settled_result: >-
      At every snapped position each contained layout paints its composition
      and nothing else - Tablet Multi-browse 186, 185, 120 and 50, Mobile
      Multi-browse 185, 121 and 55, and the centred heroes small, large, small
      once they leave the start state.
    evidence: >-
      The published compositions come to exactly the content box and never to
      a pixel more - Hero's 316 plus 56, Multi-browse's 184, 184, 120 and 56,
      each with its gaps.
  - subject: centred hero leading small item
    status: resolved
    was: >-
      The leading small painted 3dp wider than the trailing one and hung over
      the container edge.
    cause: >-
      Not the strategy. Its default keylines are symmetric and exact - small at
      0 to 56, large at 64 to 316, small at 324 to 380, both anchors outside -
      and the snap positions land on them. The renderer had been given one
      centre formula for both paths while adding multi-aspect support, and the
      advanced layouts need itemSize / 2 for the first centre where uncontained
      needs stride / 2. Half a gap moved every item off its keyline.
    resolution: >-
      The two paths branch. Every contained layout now paints its strategy's
      sizes exactly, with nothing overhanging the container.
  - subject: multi-aspect as a carousel mode
    prose: >-
      The uncontained multi-aspect ratio carousel has the same layout as the
      uncontained carousel but contains items of various sizes. Item widths can
      range anywhere between 9:16 for min width size to 16:9 for max width.
    defect: >-
      It had been built as a boolean on the carousel, with a table of five CSS
      rules restating each ratio as a width. The prose puts the variation in the
      items, not the carousel, and gives a range rather than a set, so both the
      mode and the table were inventions.
    resolution: >-
      The mode is gone. An uncontained carousel declaring no uniform width lets
      each item be as wide as its own media, which is the ratio times the
      carousel's height, in one rule for any ratio between the published bounds.
      CarouselItemMedia takes any ratio and clamps it to 9:16 and 16:9.
    also_fixed: >-
      The mask had been a width on the item's action, so an item that sized
      itself measured its own mask and collapsed to the 10dp anchor in a frame.
      It is a clip now, which is what the Android reference does: it masks, it
      does not resize.
    measured: >-
      362.67, 272, 204, 153 and 114.75 at a 204dp item height, cycling, with the
      contained layouts unchanged.
  - subject: item aspect ratio has no source yet
    prose: >-
      Item widths can range anywhere between 9:16 for min width size to 16:9
      for max width.
    status: open
    note: >-
      CarouselItemMedia takes the ratio as a prop and clamps it to those bounds,
      which is the component's whole share of the problem. What has no answer
      yet is where a real route gets the number: the Stylebook passes the five
      the Community Kit draws, and a feed cannot. WordPress keeps width and
      height in attachment metadata and federated objects carry them on their
      attachments, so the ratio is data the caller already holds rather than
      something to detect, but nothing wires it through yet. Reading
      naturalWidth after load is the fallback, and it reflows once per image.
  - subject: aspect ratio belongs only to ratio-bearing item compositions
    status: resolved
    prose: >-
      M3 publishes no item aspect ratio for Hero or Multi-browse. It publishes
      a 9:16 through 16:9 width range only for Uncontained multi-aspect ratio.
    resolution: >-
      CarouselItemMedia has no default ratio. Without an explicit ratio it
      fills the item box, whose block size belongs to the consuming composition.
      An explicit ratio derives width from block size only for a ratio-bearing
      item. The former 1:1 default made a 316 by 205 Hero item contain a 316 by
      316 image and silently clip it.
    rejected: >-
      Neither 1:1 nor the golden ratio is an M3 default. Small 56dp and medium
      120dp are measured keyline outputs, not media aspect ratios.
  - subject: adaptation is by container, not by window breakpoint
    prose: >-
      As the carousel container size increases, so do the number of carousel
      items visible at a time. On larger screens, more large items are visible.
    reading: >-
      The guidelines are written in breakpoints because on a phone the carousel
      spans the window, but the sentence that defines the behaviour says
      container size. The component measures its own track, so a carousel
      inside a pane adapts to the pane.
    evidence: >-
      With one preferred width of 186, Multi-browse shows 3, 4, 5, 7 and 9
      items at 380, 568, 808, 1168 and 1568dp of item space; Hero shows 2, 3,
      4, 5 and 6. No window breakpoint switching is needed, and a test holds
      the Hero counts.
    rejected: >-
      Deriving the preferred width per context was tried and is wrong past the
      reference frames: it held Hero at two items and grew the large one to
      1504dp at an extra-large container, which is the opposite of what the
      guidelines describe.
  - subject: multi-aspect ratio items are not production-ready
    status: known defect
    note: >-
      The layout and the masking are implemented, and the Stylebook rows are
      correct for the ratios they are handed. What is not implemented is where
      a real route gets those ratios, so every multi-aspect specimen is driven
      by hard-coded values from the Community Kit. Until the ratio has a
      source, multi-aspect is a Stylebook demonstration rather than something a
      product surface can adopt. See "item aspect ratio has no source yet".
  - subject: every multi-aspect item must declare a ratio
    status: implemented
    reason: >-
      The total width of a multi-aspect carousel is the leading padding, plus
      the height times each item's ratio, plus a gap between each pair, plus
      the trailing padding. One item without a ratio makes that sum
      unknowable, and the renderer falls back to measuring whatever the
      browser gave it.
    shape: >-
      A wrapper that shares the Uncontained engine and requires the input,
      rather than a second layout algorithm. Morph stays a mask over settled
      item boxes: resizing the boxes themselves would move the total width and
      the snap positions on every frame.
    implementation: >-
      UncontainedMultiAspectCarousel reports any item whose media declares no
      ratio and does not accept an itemWidth, which is what the uniform wrapper
      is for. It checks rather than defaulting, because a fallback ratio is a
      size the caller did not choose and M3 publishes a range for these items,
      not a value. CarouselItemMedia applies its own default internally, so the
      default never reaches the element's props and a missing ratio is really
      missing.
  - subject: keylines describe one stride, so varying widths take only the layout
    defect: >-
      Multi-aspect items were being moved onto keyline offsets and masked with
      a clip centred in the item. The keylines are built from a single width,
      so their offsets are where items sit when every stride is the same; with
      strides that differ, the items slid over each other and the declared 8dp
      gaps closed. Dropping the move alone was not enough: a centred clip then
      left the visible slice floating in its own box, measured as a 101dp gap
      where the carousel declares 8.
    resolution: >-
      A carousel whose items are all one width moves them onto the keylines and
      masks them. One with items of various sizes does neither: they stay where
      the layout put them and are cut off by the container, which is what
      "items flow past the edge of the screen" describes. Measured at 8dp
      between every pair, at rest and at four scroll positions.
    note: >-
      This is the same mistake twice over, both introduced by putting
      multi-aspect through a path built for one stride. The uniform case is
      unchanged and still verified by its own compositions.
    morph: >-
      Deferred past release by the owner, and designed rather than attempted:
      PLAN-FRONTEND-CAROUSEL-MULTI-ASPECT-MORPH.md. It needs edge zones over
      the settled boxes with an edge-anchored mask, not the single-stride
      keylines, and the two failures above are what the design exists to keep
      from recurring.
  - subject: the third item could not be focused
    defect: >-
      Arrow keys walked one item and then lost focus to the document body, so
      everything past the second item was unreachable by keyboard. Two causes:
      focus was taken before the scroll, and an item resting on an anchor
      keyline is visibility hidden, which cannot accept focus; and the scroll
      target came from the strategy, whose snap positions are generated from a
      single width, so with strides that differ it did not put the item on
      stage anyway.
    resolution: >-
      Scroll first, take the target off the hidden list, then focus. The target
      is the strategy's position when every item is one width and the item's
      own left edge when they are not, and the settle after a drag takes the
      same split, which it needed too: a release had been landing between two
      items.
    measured: >-
      All ten items reachable forward and back in multi-aspect, Hero,
      Multi-browse and centred Hero, none hidden when focused, and every landing
      within a pixel of the item's own edge.
  - subject: the outline was clipped by the mask
    defect: >-
      The optional outline was a border on the item's action, drawn at its full
      width, while the mask clips a narrower window out of the middle. From the
      third item on, the sides and all four corners fell outside the clip and
      only the top and bottom segments showed.
    resolution: >-
      Drawn inside the clip and inset by the same amount, so it traces the shape
      that is actually visible. Measured against the mask at 280, 280, 92.2,
      15.8 and 10.
  - subject: where an item lands
    policy: >-
      A contained layout has a focal position, so the strategy says where an
      item sits when it is the focus. Uncontained has none - items keep their
      size and flow past the edge - so it lands on the item's own leading edge,
      which is also the only answer available when the strides differ, because
      the strategy's positions are generated from a single width.
    measured: >-
      Uncontained lands on 288, 576, 864, 1152 and 1440 with a 280 item and an 8
      gap; multi-aspect on each item's own edge; the contained layouts keep
      their focal positions and their compositions.
  - subject: Tab did not reach every item
    defect: >-
      M3's keyboard table reads "Tab or Arrows: moves to the previous or next
      carousel item", and the file claimed every action stayed in the native
      tab order. An item resting on an anchor keyline is visibility hidden,
      which takes it out of that order: measured, Tab reached two of ten items
      and then left the carousel. The arrows had been fixed; Tab had not.
    resolution: >-
      Tab and Shift Tab move between items through the same path as the arrows
      - scroll, unhide, focus - and fall through at the ends so Tab can still
      leave. RTL does not reverse Tab, which is a document-order key.
  - subject: the ratio contract accepted unusable values
    defect: >-
      The wrapper checked that aspectRatio was not undefined, so null, 0, the
      empty string and any unparseable string passed and then fell back to a
      box with no ratio - the state the wrapper exists to prevent.
    resolution: It parses the value. Six cases are tested.
  - subject: geometry went stale when the items changed
    defect: >-
      The measurement observed only the track, and its effect depended only on
      layout, alignment and preferred width. Items arriving, leaving or
      changing ratio move every centre and every landing while the track's own
      size stays put, which is what a route with late data does.
    resolution: >-
      Every item is observed as well, and a MutationObserver on the list
      re-measures and re-observes when the children change.
  - subject: Uncontained may choose to snap
    note: >-
      AndroidX defaults Uncontained to a no-snap fling and allows the fling
      behaviour to be swapped, so the default stays and the choice is now a
      prop. The Stylebook's uniform specimen uses it, and a release settles on
      an item edge - measured, released at 150 and settled at 288.
    remaining: >-
      The settle takes the nearest landing after a pause. AndroidX advances at
      most one item per fling and reads velocity, so this is magnetism rather
      than parity.
  - subject: the visible gap is not the declared gap
    status: open
    measured: >-
      With morph on, the uniform Uncontained carousel declares an 8dp gap and
      shows 8, 4, 6.12 and 0.63 between the visible windows of successive
      items, at rest as well as after a drag.
    cause: >-
      Two spacing models meet with no adapter. AndroidX folds itemSpacing into
      each keyline's size, so a keyline size is a stride; the web implementation
      keeps a 280 content box and a separate 8dp CSS gap. The renderer uses the
      strategy's size directly as the mask width while also moving the item onto
      the keyline centre, so the spacing is counted once in one place and twice
      in another.
    not_the_cause: >-
      Snap. The gaps are already uneven at rest, and snap only chooses where a
      release lands.
    shape: >-
      One adapter converting the strategy's stride coordinates into the web's
      box-plus-gap coordinates, used by both the mask width and the translate.
      Subtracting the gap from every mask is not it - that arithmetic gives
      14.1 for one pair, because the anchor keylines are not packed edge to
      edge. Verify on the visible windows at the start, the middle, the end and
      during a drag; measuring the wrappers hides it.
    blocks: >-
      Multi-aspect morph. Starting that before the adapter exists would put the
      same coordinate confusion onto items of various widths.
  - subject: ripple feedback
    prose: Tapping a carousel item changes its shape slightly and creates a ripple.
    project_policy: Ripple is deferred as a cross-component motion decision.
    note: >-
      Item hover, focus and pressed state layers are still published and must not
      be removed. A carousel-only ripple would disagree with the rest of the
      Social frontend's interaction system.

figma_reference:
  source_kind: community-kit-implementation-reference-not-token-source
  contexts: [ Mobile, Tablet ]
  contexts_are_public_api: false
  layout_property_values:
    - Hero
    - Center-aligned hero
    - Multi-browse
    - Uncontained
    - Multi-aspect ratio
  full_screen_component_set:
    contexts: [ Mobile ]
    layout: Full screen
  item_aspect_ratio_building_blocks: [ "16:9", "4:3", "1:1", "3:4", "9:16" ]
  optional_text_building_block:
    label: required-when-shown
    supporting_text: optional
    visibility_is_composition_owned: true
    overlay:
      gap: 4
      padding: 16
      gradient_extent: full-item
      content_alignment: block-end
      background: linear-white-transparent-to-black-50-percent
      label_typescale: title-medium
      supporting_typescale: label-small
      foreground: md.ref.palette.neutral100
  specimen_only_controls:
    - Show 4th item
    - Show 5th item
  mapping:
    center_aligned_hero: Hero alignment configuration
    multi_aspect_ratio: Uncontained aspect configuration
    context: specimen viewport, not a runtime breakpoint prop
  measured_profiles:
    provenance: Figma Community Kit inspection
    container_block_size_note: >-
      The composition is the item height between the block padding: 205 plus 8
      and 8 is the 221 of Compose's reference modifier. A native scrollbar is
      laid out inside the border box, so leaving one visible measured 236
      instead. The component hides it; drag, wheel and keyboard still scroll,
      and the guidelines' Show all path is what serves people who cannot.
    note: >-
      These are measured specimen profiles, not responsive breakpoint tokens.
      They establish the exact Mobile and Tablet compositions used by the
      reference frame; wider containers still require the strategy algorithm.
    hero:
      mobile:
        item_block_size: 205
        items:
          - { role: large, inline_size: 316, block_size: 205 }
          - { role: small, inline_size: 56, block_size: 205 }
      tablet:
        item_block_size: 204
        items:
          - { role: large, inline_size: 184, block_size: 204 }
          - { role: large, inline_size: 184, block_size: 204 }
          - { role: medium, inline_size: 120, block_size: 204 }
          - { role: small, inline_size: 56, block_size: 204 }
    multi-browse:
      mobile:
        item_block_size: 205
        items:
          - { role: large, inline_size: 188, block_size: 205 }
          - { role: medium, inline_size: 120, block_size: 205 }
          - { role: small, inline_size: 56, block_size: 205 }
      tablet:
        item_block_size: 204
        items:
          - { role: large, inline_size: 184, block_size: 204 }
          - { role: large, inline_size: 184, block_size: 204 }
          - { role: medium, inline_size: 120, block_size: 204 }
          - { role: small, inline_size: 56, block_size: 204 }
    center-aligned-hero:
