source_boundaries:
  published_item_tokens:
    - color, elevation and extra-large shape
    - enabled, hovered, focused, pressed and disabled states
    - optional outline and focus indicator
  prose_only_layout_values:
    - 16dp inline padding
    - 8dp block padding
    - 8dp ordinary gap
    - 16dp full-screen gap
    - 40–56dp small item width range
    - 4dp Show all button padding
    - 48dp header arrow icon button size
  implementation_policy:
    published_md_tokens_only: true
    prose_layout_values_use_ax_namespace: true
    measured_keyline_layouts: [ multi-browse, hero ]
    measured_keyline_values_are_runtime_inputs: false
    measured_keyline_profiles_are: static-regression-fixtures
    runtime_strategy_source:
      project: AndroidX Material 3 Carousel
      license: Apache-2.0
      revision: a0c645de83b353f2aa79c3b33a11e8ba853ca1e4
      adapted_parts: [ Arrangement, Keylines ]
      project_owned_parts: [ DOM measurement, scrolling, rendering, web public API ]
    sizing_basis: carousel-container-inline-size
    sizing_basis_note: >-
      A carousel can live inside a pane whose width differs from the window.
      Figma's Mobile and Tablet names remain specimen contexts; they are not
      breakpoint props and do not select the runtime strategy.
    boundary_state_policy: android-derived-multi-step-start-default-end-keylines
    public_variant_api:
      uncontained: { width_prop: itemWidth, scroll: default }
      multi-browse: { width_prop: preferredItemWidth, scroll: snap }
      centered-hero: { width_prop: preferredItemWidth, scroll: snap }
    compatibility_paths:
      start-aligned-hero: generic-carousel-until-a-current-public-platform-contract-exists
      multi-aspect-ratio: uncontained-composition-not-an-androidx-public-variant
  implementation_status:
    measured_keyline_profiles: implemented
    center_aligned_hero: implemented
    multi_aspect_ratio: implemented-as-uncontained-configuration
    carousel_text_overlay: implemented
    resize_recalculation: implemented
    scroll_position_morph: implemented-with-androidx-derived-keyline-strategy
    scroll_position_morph_model: large-slot-plus-interpolated-multi-step-keylines
    scroll_position_morph_note: >-
      Each advanced item occupies the strategy's focal size as its underlying
      scroll slot. JavaScript masks and offsets the content against interpolated
      start, default and end keyline steps. Snapping uses the same strategy and
      item index instead of DOM offsets. Figma's 412px and 600px profiles remain
      independent output fixtures and are not inputs to this path.
    stylebook_media: picsum-seeded-images
    stylebook_media_scope: fixture-only-not-component-data

lab_reference:
  path: products/reference-implementations/axismundi-lab/modules/carousel
  reusable:
    - native horizontal overflow
    - CSS scroll-snap fallback
    - reduced-motion branch
    - usable scrolling when JavaScript is unavailable
  do_not_promote:
    - focusable carousel container
    - previous and next controls inside or beside the carousel
    - fixed large, medium and small item classes as the production sizing model
    - Lab interaction-state policy as current M3 evidence

component_implementation_order:
  - Carousel and CarouselItem DOM, keyboard and labeling contract
  - Uncontained, also used as every layout's reduced-motion geometry
  - Multi-browse keylines, masking and dynamic widths
  - Hero and full-screen

# Gaps the upstream implementations name and this component does not have yet.
# Flutter's spellings are kept rather than translated, so a reader can find the
# upstream definition from the name alone.
upstream_api_gaps:
  - name: initialItem
    upstream: Flutter CarouselController(initialItem:)
    missing_here: >-
      The carousel always starts at the first item, and a Social route that
      points at one object has no way to say so.
  - name: shrinkExtent
    upstream: Flutter CarouselView(itemExtent:, shrinkExtent:)
    missing_here: >-
      The floor an item shrinks to while leaving the container. The masking
      itself is implemented now, and the floor comes from the AndroidX anchor
      size, which is internal to the strategy. Flutter makes it an input; here
      a caller cannot raise it.
  - name: consumeMaxWeight
    upstream: Flutter CarouselView.weighted(consumeMaxWeight:)
    missing_here: >-
      Whether the first and last items may occupy the largest slot. Our
      start and end keyline steps decide this with no way to turn it off.
  - name: scrollBehavior for Uncontained
    upstream: M3 guidelines, both default and snap scrolling
    missing_here: >-
      UncontainedCarousel hardcodes default scrolling, so the published snap
      option is unreachable through the wrapper.
