      size: 16
    supporting_text:
      typography_role: body-medium
      size: 14
    overline:
      typography_role: label-small
      size: 11
  trailing:
    types: [ trailing-supporting-text, icon, icon-button, selection-control ]
    max_width_rule: narrower-than-content
    supporting_text:
      typography_role: label-small
      size: 11
    icon:
      baseline_token: md.comp.list.list-item.trailing-icon.size
      baseline_size: 24
      expressive_token: md.comp.list.list-item.trailing-icon.expressive.size
      expressive_size: 20

focus_indicator:
  color_token: md.comp.list.focus.indicator.color
  color_role: secondary
  thickness_token: md.comp.list.focus.indicator.thickness
  thickness: 3
  inner_offset_token: md.comp.list.focus.indicator.outline.offset
  inner_offset: -3

# M3 prose names the label/supporting-text forms but does not say whether an
# overline alone consumes the three-line minimum. Count occupied text rows so
# this React primitive has an explicit, reviewable local rule.
line_count_inference:
  status: project-policy
  explicit_lines: honored
  inferred:
    headline: 1
    headline_supporting: 2
    headline_overline: 2
    headline_overline_supporting: 3
  rationale: >-
    Overline consumes one text row. A row reaches the three-line minimum only
    when headline, overline, and supporting text are all present.

interaction_contract:
  implemented:
    - static
    - single-action-link
    - single-action-button
  native_hosts:
    static: div
    link: a
    button: button
  list_host: ul
  item_host: li
  selected: deferred-to-list-controller
  selection_modes_deferred: [ single-select, multi-select ]
  interactions_deferred: [ multi-action, drag, reorder, reveal, swipe, expand, collapse ]
  disabled_input_safety:
    status: implemented-behavior-and-published-content-opacity
    button: native-disabled
    link: omit-href-and-click-handler-with-aria-disabled
    content_opacity: 0.38
    tokens:
      label_text: md.comp.list.list-item.disabled.label-text.opacity
      leading_icon: md.comp.list.list-item.disabled.leading-icon.opacity
      overline: md.comp.list.list-item.disabled.overline.opacity
      supporting_text: md.comp.list.list-item.disabled.supporting-text.opacity
      trailing_icon: md.comp.list.list-item.disabled.trailing-icon.opacity
    excluded: >-
      No unselected disabled container-opacity token is published. Do not invent
      one by applying opacity to the entire row; selected.disabled belongs to
      the deferred List selection controller.
  rationale: >-
    Selection belongs to List because one list permits only one selection mode.
    Opening selected on independent rows cannot enforce one-of-many or
    many-of-many state. Multi-action likewise needs its own focus controller.

token_families:
  implemented_now:
    - md.comp.list.container.*
    - md.comp.list.list-item.container.expressive.*
    - md.comp.list.list-item.{one-line,two-line,three-line}.container.height
    - md.comp.list.list-item.{leading,top,bottom,trailing,between}-space
    - md.comp.list.list-item.{label-text,supporting-text,overline,trailing-supporting-text}.*
    - md.comp.list.list-item.leading-{icon,avatar,image,video}.*
    - md.comp.list.list-item.trailing-icon.*
    - md.comp.list.focus.indicator.*
    - md.comp.list.list-item.disabled.{label-text,leading-icon,overline,supporting-text,trailing-icon}.opacity
  deferred_with_contract:
    - md.comp.list.list-item.selected.*
    # The disabled state layer is published but deliberately unpainted: a row
    # that cannot be activated should not answer hover, press, or focus.
    - md.comp.list.list-item.disabled.{state-layer.*,container.expressive.shape}
    - md.comp.list.list-item.dragged.*
    - md.comp.list.expand.*

theme_cross_surface:
  source: products/wordpress/themes/axismundi/styles/blocks/list-segmented.json
  status: shipped-reference-not-react-implementation
  # This is a cross-surface invariant, not a shared runtime CSS variable.
  segmented_gap: 2
  unselected_inner_shape: 4
  outer_shape: 16
  selected_shape: 16
  theme_spacing_presets:
    space25: 2
    space125: 10
    space150: 12
    space200: 16

evidence_not_product:
  lab: products/reference-implementations/axismundi-lab/modules/list
  reasons_not_to_port:
    - Its resting radius is corner.medium rather than the expressive 4dp token.
    - It puts aria-selected on li without a listbox owner.

not_implemented:
  - List selection controller and listbox semantics
  - Persisted selected state
  - Multi-action row and arrow-key controller
  - Selection controls
  - Swipe-to-reveal, reorder, drag, expand, and collapse
  - Avatar primitive ownership; ListItem accepts an avatar node in its leading slot
