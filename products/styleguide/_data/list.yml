      size: 40
      shape_token: md.comp.list.list-item.leading-avatar.shape
      shape_role: corner.full
    image:
      width_token: md.comp.list.list-item.leading-image.width
      height_token: md.comp.list.list-item.leading-image.height
      width: 56
      height: 56
      expressive_shape_token: md.comp.list.list-item.leading-image.expressive.shape
      expressive_shape_role: corner.small
    video:
      width_token: md.comp.list.list-item.small.leading-video.width
      height_token: md.comp.list.list-item.small.leading-video.height
      width: 100
      height: 56
      shape_token: md.comp.list.list-item.leading-video.shape
      shape_role: corner.small
  content:
    min_width: 0
    largest_slot: true
    headline:
      published_token_name: label-text
      api_slot_name: headline
