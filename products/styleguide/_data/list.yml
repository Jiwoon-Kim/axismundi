# Material 3 Lists.
#
# Sources:
# - https://m3.material.io/components/lists/overview
# - https://m3.material.io/components/lists/specs
# - https://m3.material.io/components/lists/guidelines
# - https://m3.material.io/components/lists/accessibility
# - https://material-web.dev/components/list/
# - https://developer.android.com/reference/kotlin/androidx/compose/material3/ListItem
#
# Token evidence:
# products/wordpress/plugins/axismundi/docs/m3-token-tables/SOURCE-M3-LISTS-RAW.md
#
# The raw file is intentionally a token-table capture only. This record also
# carries the prose contracts that decide ownership: Expressive versus baseline,
# slot geometry, selection modes, and web accessibility. It is a decision record,
# not a generated copy of the 305 token rows.

meta:
  namespace: md.comp.list
  table_revision: "2026-05-27T22:44:15.009106Z"
  included_token_count: 305
  raw_evidence: products/wordpress/plugins/axismundi/docs/m3-token-tables/SOURCE-M3-LISTS-RAW.md
  # The raw table owns the complete inventory. This file names the consumed
  # tokens and every deferred family so that a partial implementation cannot
  # claim to ship every row in the 305-row table.
  token_inventory_owner: raw-token-table
  current_slice: expressive-static-and-single-action

prose_sources:
  variants:
    source: https://m3.material.io/components/lists/specs
    statement: >-
      Expressive lists are the current variant. Baseline remains available but
      is not recommended; on web, expressive lists build on baseline lists.
  slots:
    source: https://m3.material.io/components/lists/specs
    statement: >-
      Custom lists divide into leading, content, and trailing slots. Leading and
      trailing remain narrower than content; each target remains at least 48dp.
  selection:
    source: https://m3.material.io/components/lists/specs
    statement: A list has exactly one selection mode at a time.
  accessibility:
    source: https://m3.material.io/components/lists/accessibility
    statement: >-
      Single-action items are activated with Space or Enter. Multi-action items
      own their individual actions and keyboard movement between them.

variants:
  baseline:
    status: available-not-recommended
    item_container_shape_token: md.comp.list.list-item.container.shape
    item_container_shape_role: corner.none
    item_container_shape: 0
  expressive:
    status: implemented
    styles: [ standard, segmented ]
    item_container_shape_token: md.comp.list.list-item.container.expressive.shape
    item_container_shape_role: corner.extra-small
    item_container_shape: 4
    hovered_container_shape_token: md.comp.list.list-item.hovered.container.expressive.shape
    hovered_container_shape_role: corner.medium
    hovered_container_shape: 12
    focused_container_shape_token: md.comp.list.list-item.focused.container.expressive.shape
    focused_container_shape_role: corner.large
    focused_container_shape: 16
    selected_container_shape_token: md.comp.list.list-item.selected.container.expressive.shape
    selected_container_shape_role: corner.large
    selected_container_shape: 16

selection_state:
  status: published-deferred-to-list-controller
  selected_container_shape_token: md.comp.list.list-item.selected.container.expressive.shape
  selected_container_shape_role: corner.large
  selected_container_shape: 16

# `list.container.shape` belongs to the List container, not a row. The values in
# this entry are published; applying the container value to the first and last
# visible rows is the project policy that maps a group shape onto ordinary DOM.
segmented_group_shape_policy:
  source_token: md.comp.list.container.shape
  source_role: corner.large
  outer_shape: 16
  unselected_inner_shape_token: md.comp.list.list-item.container.expressive.shape
  unselected_inner_shape: 4
  selected_row_shape_token: md.comp.list.list-item.selected.container.expressive.shape
  selected_row_shape: 16
  dom_mapping: first-middle-last
  rationale: >-
    M3 publishes a 16dp List container shape and a 4dp expressive row shape,
    but no position-specific row token. First/last corners therefore borrow the
    List container value while middle rows keep the expressive row value.

measurements:
  one_line:
    token: md.comp.list.list-item.one-line.container.height
    minimum_height: 56
  two_line:
    token: md.comp.list.list-item.two-line.container.height
    minimum_height: 72
  three_line:
    token: md.comp.list.list-item.three-line.container.height
    minimum_height: 88
  # These are minima. They do not derive from the text line-box arithmetic.
  minimum_height_conditions:
    applies_without_taller_slot: true
    tallest_slot_expands_row: true
    source: >-
      M3 states that the tallest element determines the List item size. The
      published 56/72/88dp values are therefore minimums for rows whose slots
      do not exceed them.
  padding_block:
    token: md.comp.list.list-item.top-space / md.comp.list.list-item.bottom-space
    value: 10
    space_token: md.sys.measurement.space125
  padding_inline:
    token: md.comp.list.list-item.leading-space / md.comp.list.list-item.trailing-space
    value: 16
    space_token: md.sys.measurement.space200
  slot_gap:
    token: md.comp.list.list-item.between-space
    value: 12
    space_token: md.sys.measurement.space150
  segmented_gap:
    token: md.comp.list.segmented.gap
    value: 2
    space_token: md.sys.measurement.space25

slots:
  leading:
    types: [ icon, avatar, image, video ]
    max_width_rule: narrower-than-content
    icon:
      baseline_token: md.comp.list.list-item.leading-icon.size
      baseline_size: 24
      expressive_token: md.comp.list.list-item.leading-icon.expressive.size
      expressive_size: 20
    avatar:
