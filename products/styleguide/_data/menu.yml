# Material 3 Menus -- the published specification.
#
# Sources:
# - https://m3.material.io/components/menus/overview
# - https://m3.material.io/components/menus/specs
# - https://m3.material.io/components/menus/guidelines
# - https://m3.material.io/components/menus/accessibility
#
# Two namespaces carry this component, and they are not two spellings of one
# thing. `md.comp.menu` is the baseline row; `md.comp.menus` is the M3
# Expressive row, whose official name is "Vertical menus". See `variants` for
# which one this project implements and what the other one costs.

meta:
  namespace: md.comp.{menu,menus}
  table_revision: "2026-05-27T22:44:15.009106Z"
  included_token_count: 301
  deprecated_token_count: 46
  raw_evidence: products/wordpress/plugins/axismundi/docs/m3-token-tables/SOURCE-M3-MENUS-RAW.md
  current_slice: vertical-menu-standard-single-level

prose_sources:
  usage:
    source: https://m3.material.io/components/menus/overview
    statement: A menu shows a temporary set of actions; actions that must stay on screen belong in a toolbar.
  variants:
    source: https://m3.material.io/components/menus/specs
    statement: >-
      Vertical menus carry the latest shapes, colour styles, selection states
      and submenu motion. Baseline menu is still available to use, but does not.
  groups_on_web:
    source: https://m3.material.io/components/menus/guidelines
    statement: Gaps are not currently available on web. On web, use a divider to separate menu items.
  scrolling:
    source: https://m3.material.io/components/menus/guidelines
    statement: Menus scroll when the items do not fit, and show a persistent scrollbar. Do not use gaps in a scrollable menu.
  placement:
    source: https://m3.material.io/components/menus/guidelines
    statement: >-
      A menu is positioned relative to the window edge and repositions itself to
      the left, right or above its trigger rather than being cut off.
  submenus:
    source: https://m3.material.io/components/menus/guidelines
    statement: Submenus open next to the parent menu item without overlapping it, and are best on large screens.
  adaptive:
    source: https://m3.material.io/components/menus/guidelines
    statement: Consider adapting menus into bottom sheets on compact windows, which have room for more items and longer labels.
  initial_focus:
    source: https://m3.material.io/components/menus/accessibility
    statement: When a menu opens, focus should be placed on the first menu item.
  slots:
    source: https://m3.material.io/components/menus/accessibility
    statement: >-
      Nested elements perform one action only; buttons, switches and other direct
      actions do not go inside a menu item, and targets are 48x48dp or larger.

# ---------------------------------------------------------------------------
# Which row of the component this project builds.
# ---------------------------------------------------------------------------

variants:
  vertical:
    status: implemented
    official_name: Vertical menus
    namespace: md.comp.menus
    availability: M3 Expressive only
    note: The axis is named in the title, which is why `horizontal` below has a namespace at all.
  baseline:
    status: not_implemented
    official_name: Menu (baseline)
    namespace: md.comp.menu
    availability: M3 and M3 Expressive
    deprecated: false
    live_token_count: 4
    live_tokens:
      - md.comp.menu.container.color
      - md.comp.menu.container.elevation
      - md.comp.menu.container.shadow-color
      - md.comp.menu.container.shape
    reason: >-
      Available is not the same as complete. Every item token in this namespace
      is deprecated -- the whole `md.comp.menu.list-item.*` family, with the
      stated reason "use standalone list component tokens instead" -- so what
      survives is a container and nothing to put in it. Building a baseline menu
      item means consuming deprecated tokens or inferring from List. This
      project has no saved content carrying a baseline menu, so there is no
      compatibility debt to pay for the way there is with `is-style-outlined`
      on Button.
    reopen_when: M3 republishes non-deprecated item tokens in this namespace.
  horizontal:
    status: published_without_prose
    namespace: md.comp.menus.horizontal
    token_count: 20
    reason: >-
      The token table publishes a horizontal layout -- container shape
      corner.full, an icon-only sub-variant, its own item spacing and shapes --
      and no published prose mentions it. Not in overview, specs, guidelines or
      accessibility; not in Material Web's menu documentation; not in Compose.
      Recorded as published, not implemented, and not explained.
    design_kit: absent
    design_kit_evidence: >-
      Read through the connector: the kit's Menu page holds exactly two
      sections, Baseline and the expressive one, and the expressive section
      holds Configurations, the Menu variants over Theme and Groups, and the
      building blocks. No horizontal frame anywhere. So this is a token family
      with no drawing and no prose -- it lives in the token database alone.

colour_styles:
  standard:
    status: implemented
    emphasis: lower
    basis: surface
    container_color_token: md.comp.menus.standard.container.color
    container_color_role: surface-container-low
  vibrant:
    status: deferred
    emphasis: higher
    basis: tertiary
    container_color_token: md.comp.menus.vibrant.container.color
    container_color_role: tertiary-container
    deferral_reason: >-
      M3 says vibrant menus are more prominent and should be used sparingly.
      Nothing in this product has asked for one, and a second colour route costs
      a full state matrix. The tokens are published and the route is additive.

# ---------------------------------------------------------------------------
# Container.
# ---------------------------------------------------------------------------

container:
  elevation_token: md.comp.menus.container.elevation
  elevation_level: 2
  elevation_dp: 3
  # The standard namespace publishes its own shadow colour; the identically
  # valued `md.comp.menu.container.shadow-color` belongs to the baseline row
  # this record does not build.
  shadow_color_token: md.comp.menus.standard.container.shadow-color
  shadow_color_role: shadow
  shape_token: md.comp.menus.container.shape
  shape_role: corner.large
  shape: 16
  # Shape morphing. M3 states that as focus moves between submenus the focused
  # one becomes more rounded and the unfocused one less so. These are the two
  # ends of that morph, and they are the reason the component has an "active"
  # concept at container level at all.
  active_shape_token: md.comp.menus.active.container.shape
  active_shape_role: corner.large
  active_shape: 16
  inactive_shape_token: md.comp.menus.inactive.container.shape
  inactive_shape_role: corner.small
  inactive_shape: 8

  # Measured in the Material 3 Design Kit, which publishes a width where M3
  # publishes none. Taken as a floor rather than a fixed width: one instance of
  # one kit is not a published minimum, and a menu whose longest label does not
  # fit is worse than a wide one.
  inline_size_floor: 208
  # A group is its own padding plus its visible rows, where a row is an item or
  # a section label. Verified against six instances read through the connector:
  #
  #   196  4 + 4 x 48                     four items
  #   228  4 + 32 + 4 x 48                a label and four items
  #   292  4 + 6 x 48                     six items
  #   324  4 + 32 + 6 x 48                a label and six items
  #   394  196 + 2 + 196                  two groups
  #   592  196 + 2 + 196 + 2 + 196        three groups
  #
  # Useful because it is what any item-count cap would have to be expressed in.
  block_size_formula: >-
    group_padding_block * 2 + item_count * item_slot_height
    + label_count * section_label_height

scrollbar:
  status: measured_not_implemented
  track_inline_size: 12
  thumb_inline_size: 4
  spans: the full height of the list it belongs to
  note: >-
    The kit draws a scrollbar as a static layer; its height does not change when
    the variant is switched on, so nothing in it says when a menu begins to
    scroll.
  persistent:
    status: published_requirement_unmet
    source: https://m3.material.io/components/menus/guidelines
    statement: Menus can scroll when all menu items can't display at once. In this state, menus show a persistent scrollbar.
    why_it_is_not_met: >-
      Neither the platform default nor `scrollbar-width: thin` is persistent:
      an overlay scrollbar fades when the pointer stops. And the measured 12dp
      track with a 4dp thumb is not any user agent's `thin` -- it is drawn.
    do_not_guess: >-
      Whether `scrollbar-gutter`, `scrollbar-color`, a `::-webkit-scrollbar`
      rule or a drawn element gets there is a measurement across engines, not a
      reading. Nothing is implemented for it.
  house_convention:
    rule: A component that makes its own scroll region styles that scrollbar; nothing styles the document's.
    measured_at:
      - { where: products/wordpress/themes/axismundi/style.css, does: "`pre` takes `scrollbar-width: thin` with a tokenised colour and an 8px webkit track" }
      - { where: products/wordpress/plugins/axismundi/src/apps/frontend/styles/components/carousel.css, does: hides its own scrollbar }
      - { where: products/wordpress/plugins/axismundi/src/apps/frontend/styles/components/tabs.css, does: hides its own scrollbar on the scrollable layout }
    note: >-
      Three places, none of them the document. The convention was read off the
      code rather than decided here, and the menu's list is a component scroll
      region like the other three.

# ---------------------------------------------------------------------------
# Item. The two boxes here are the thing this component is easiest to get
# wrong: the slot is the hit target and the container is what gets painted.
# ---------------------------------------------------------------------------

item:
  # Published.
  container_height_token: md.comp.menus.menu-item.height
  container_height: 44
  # Measured, not token-published. The specs Measurements figure is an image,
  # and Figma gives the same item a 48dp slot with 2dp vertical and 4dp
  # horizontal padding around the 44dp box. State layer, corner radius and the
  # selected container colour belong to the 44; the pointer and the 48x48dp
  # accessibility target belong to the 48.
  slot_height: 48
  inset_block: 2
  inset_inline: 4
  geometry_source: specs Measurements image, confirmed in the Material 3 Design Kit, node 55141-14250
  # Enforced arithmetic rather than three frozen numbers: if any one of them
  # moves without the others, this stops being true.
  invariant: slot_height - 2 * inset_block == container_height
  # The three figures above that no token backs. Everything else under `item`
  # names its token, and the validator holds that line: a numeric value here is
  # either token-backed or listed in `unpublished`, so an inferred number cannot
  # arrive later and read as published.
  #
  # In CSS these are literals in the component slot, not
  # `var( --md-sys-measurement-space25 )` and `space50`. They happen to equal
  # those two, and a coincidence of value is not a published reference -- M3
  # never put this inset on the spacing scale. Writing it as one would also let
  # a theme-level change to the scale move a figure that was measured off a
  # picture. Same treatment as Badge's maximum-character width and inline
  # padding, which are recorded the same way for the same reason.
  unpublished:
    - slot_height
    - inset_block
    - inset_inline
    - state_layer_padding_block
    - state_layer_padding_inline
    - state_layer_between_space
    - content_inline_size
    - content_block_size_one_line
    - content_block_size_with_supporting_text

  # The painted box is named `State Layer` in the kit, which is what it is.
  # These three are its own padding and gap, inside the 4dp and 2dp insets
  # above.
  state_layer_padding_inline: 12
  state_layer_padding_block: 12
  state_layer_between_space: 8
  # The text block the kit reports between the leading and trailing elements.
  # It is a consequence of every other horizontal figure, which is why it is
  # worth pinning: it is the one measurement that tests them all at once, and
  # it is what settles 8 against the table's 12.
  content_inline_size: 120
  content_block_size_one_line: 20
  content_block_size_with_supporting_text: 36
  # Composition, not a second source: 4 + 12 is the 16dp the token publishes
  # from the slot's edge. Pinned, because it is the one place the measured
  # inset and a published token have to agree.
  leading_space_composition: inset_inline + state_layer_padding_inline == leading_space

  shape_token: md.comp.menus.menu-item.shape
  shape_role: corner.extra-small
  shape: 4
  first_child_shape_token: md.comp.menus.menu-item.first-child.shape
  first_child_shape_role: corner.medium
  first_child_shape: 12
  first_child_inner_corner_token: md.comp.menus.menu-item.first-child.inner-corner.corner-size
  first_child_inner_corner_role: corner.extra-small
  first_child_inner_corner: 4
  last_child_shape_token: md.comp.menus.menu-item.last-child.shape
  last_child_shape_role: corner.medium
  last_child_shape: 12
  last_child_inner_corner_token: md.comp.menus.menu-item.last-child.inner-corner.corner-size
  last_child_inner_corner_role: corner.extra-small
  last_child_inner_corner: 4
  selected_shape_token: md.comp.menus.menu-item.selected.shape
  selected_shape_role: corner.medium
  selected_shape: 12

  leading_space_token: md.comp.menus.menu-item.leading-space
  leading_space: 16
  trailing_space_token: md.comp.menus.menu-item.trailing-space
  trailing_space: 16
  between_space_token: md.comp.menus.menu-item.between-space
  between_space: 12
  # Published, referent still undetermined, and the kit cannot settle it.
  #
  # 44 minus 8 and 8 is 28, which is not the label's 20dp line box. The kit
  # measures 12 and 12 instead, and 44 - 12 - 12 is exactly 20. The leading
  # hypothesis was that the token's 8 belongs to an item grown to carry
  # supporting text -- 20 + 16 + 8 + 8 = 52 closes just as neatly -- but the
  # The kit cannot produce the 52 the hypothesis needs. Read through the
  # connector, its text block is a `Type=Text` symbol 20dp tall whose
  # `Supporting text` layer is hidden and 16dp, and there is no two-line menu
  # item anywhere: all eleven `Menu item/Standard` state symbols are 48. The
  # painted box's 12dp vertical padding is an auto-layout property and does not
  # change with its content, so showing that layer gives a 36dp block in a 60dp
  # box inside a 64dp item -- not 52 and 56.
  #
  # So the hypothesis is unsupported by the only source that could have drawn
  # it, and the token's 8 stays unplaced. An earlier version of this record
  # reached the same conclusion for the wrong reason, saying the box was fixed
  # at 44; it is not fixed, there is simply no two-line variant to measure.
  #
  # Derived from the kit's layout properties rather than read off a selection.
  #
  # Build the single-line item from the measured 12. Leave these two recorded
  # and unused until a two-line item is actually measured somewhere.
  top_space_token: md.comp.menus.menu-item.top-space
  top_space: 8
  bottom_space_token: md.comp.menus.menu-item.bottom-space
  bottom_space: 8

  leading_icon_size_token: md.comp.menus.menu-item.leading-icon.size
  leading_icon_size: 20
  trailing_icon_size_token: md.comp.menus.menu-item.trailing-icon.size
  trailing_icon_size: 20

  label_text_typography_role: label-large
  supporting_text_typography_role: body-small
  trailing_supporting_text_typography_role: label-large

  focus_indicator:
    color_token: md.comp.menus.menu-item.focus.indicator.color
    color_role: secondary
    thickness_token: md.comp.menus.menu-item.focus.indicator.thickness
    thickness: 3
    inner_offset_token: md.comp.menus.menu-item.focus.indicator.outline.offset
    inner_offset: -3

# M3's anatomy list for a vertical menu, in its published order.
anatomy:
  - { part: Menu item, optional: false }
  - { part: Leading icon, optional: true }
  - { part: Menu item text, optional: false }
  - { part: Trailing icon, optional: true }
  - { part: Badge, optional: true }
  - { part: Trailing text, optional: true }
  - { part: Container, optional: false }
  - { part: Supporting text, optional: true }
  - { part: Label text, optional: true }
  - { part: Gap, optional: true }
  - { part: Divider, optional: true }

section_label:
  color_token: md.comp.menus.standard.section-label-text.color
  color_role: on-surface-variant
  focusable: false
  # Measured. The kit's `Label` row, which carries its own trailing divider
  # slot the way a menu item does.
  height: 32
  padding_inline: 4
  padding_block: 0
  content_padding_inline: 12
  # Measured from the Figma Content layer. These are deliberately asymmetric:
  # top 6dp, bottom 0dp. Do not replace them with a centering formula.
  content_padding_block_start: 6
  content_padding_block_end: 0
  content_gap: 8
  leading_icon_size: 20
  divider_slot: optional divider follows the label content inside the group label row
  geometry_source: Material 3 Design Kit, node 55141-14250

# ---------------------------------------------------------------------------
# Grouping. The published token and the published prose disagree about the
# platform, so this is where the decision lives rather than in the CSS.
# ---------------------------------------------------------------------------

grouping:
  divider:
    status: implemented
    owner: divider component
    owner_note: >-
      Every nested divider token in this namespace is deprecated in favour of
      the standalone `md.comp.divider.*`, so Menu consumes Divider and publishes
      nothing of its own for it.
    use_for: [ scrollable menus, text field dropdown menus ]
    # Measured: in the kit a divider is a 4dp slot inside the item that
    # precedes it, not a row between items. Hidden, it contributes nothing,
    # which is why a 48dp item still measures 48.
    slot_block_size: 4
    lives_inside: the preceding item
    geometry_source: Material 3 Design Kit, node 55141-14250
  gap:
    status: not_implemented_on_web
    gap_token: md.comp.menus.gap
    gap: 2
    group_padding_token: md.comp.menus.group.padding
    group_padding: 2
    group_shape_token: md.comp.menus.group.shape
    group_shape_role: corner.small
    group_shape: 8
    reason: M3 states that gaps are not currently available on web and that web should use a divider.
    limits_if_it_ever_lands: [ do not change the gap size, one or two gaps per menu, never in a scrollable menu ]

# Three independent sources name the same constraint, so it is recorded once
# here rather than discovered during implementation.
#
# Whether it binds THIS implementation is a separate question, opened below:
# every source describes a submenu rendered inside its parent's box, and ours
# would not be.
mutual_exclusions:
  - subject: scrolling and gaps
    source: https://m3.material.io/components/menus/guidelines
    statement: Do not use gaps if a menu scrolls; this is currently unsupported.
  - subject: scrolling and submenus
    source: https://github.com/material-components/material-web/blob/main/docs/components/menu.md
    statement: >-
      A root menu containing submenus needs `has-overflow`, whose effect is to
      disable overflow scrolling so the nested menu can be displayed. The same
      page warns that setting `max-height` has adverse effects when items
      overflow.
  - subject: scrolling and submenus, again
    source: products/wordpress/themes/axismundi/assets/styles/blocks.navigation-submenu.css
    statement: >-
      This repository's own navigation submenu stylesheet refuses `overflow:
      hidden` on the popover box, in its own words, because it would clip a
      nested submenu. Reached independently, on core's markup.

# ---------------------------------------------------------------------------
# Structure. Menu is shaped like a list and valued like a menu.
# ---------------------------------------------------------------------------

# Raised by the owner while reading the first implementation, and not settled.
mutual_exclusion_scope:
  status: owner_judgment_open
  question: >-
    Whether a menu that scrolls can carry a submenu here, and if the exclusion
    does bind, whether its unit is the whole menu or one group.
  why_it_may_not_bind: >-
    All three recorded sources describe a submenu rendered inside its parent's
    box -- Material Web's nested `md-menu`, core's absolutely positioned
    container, and this theme's own popover box -- which is why an ancestor's
    `overflow` clips them. This implementation hosts a menu in the top layer,
    and the top layer escapes an ancestor's overflow. Measured in this project
    for the dialog, with an in-flow probe as a positive control.
  why_the_unit_may_be_the_group: >-
    The kit's menu is groups, not rows: `Menu > List content > Menu-item`. An
    editor's format menu is the case that makes this concrete -- a long
    scrolling list of sizes beside a group whose rows open submenus. A
    per-menu exclusion forbids that; a per-group one allows it.
  settle_by: >-
    Build one submenu inside a scrolling menu and look at whether it is
    clipped. Until then the record keeps the exclusion as inherited rather
    than established, and the implementation builds neither.
  note: >-
    The implementation already puts the scroll on the group rather than the
    menu, because the elevation layer cannot sit inside a scrolling box. That
    is a consequence of elevation, not an answer to this question.

structure:
  shaped_like: list
  evidence:
    - M3 deprecated the embedded menu item tokens with the reason "use standalone list component tokens instead".
    - Material Web composes `md-list`, and `md-menu-item` extends `md-list-item`.
  values_owned_by: menu
  divergence:
    - { property: item height, menu: 44, list: "56 / 72 / 88 (one / two / three line)" }
    - { property: label text, menu: label-large, list: body-large }
    - { property: supporting text, menu: body-small, list: body-medium }
  conclusion: >-
    Roles and structure follow a list; none of the three measured values agree
    with List, so Menu publishes its own item slots and does not consume
    `list.yml`.

# ---------------------------------------------------------------------------
# Behaviour and accessibility.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# The group. Opened after the first implementation shipped a flat list of rows
# that cannot express one.
# ---------------------------------------------------------------------------

group:
  status: axis_settled_composition
  is_a_level: true
  evidence:
    - { source: design kit, says: "Its tree is Menu > List N content > [Label] + Menu-item*, and the menu variants are Groups = 1, 2, 3." }
    - { source: M3 guidelines, says: "Vertical menu items can be grouped by adding a divider or small gap, to bundle similar actions." }
    - { source: "@wordpress/ui Menu", says: "Decomposes into Group, GroupLabel, Separator, RadioGroup and RadioItem, so the group is a component rather than a convention." }
    - { source: "MDN, role=menu", says: "Menu items can be grouped in elements with the `group` role, and separated by `separator` elements." }
  owns:
    padding_block:
      token: md.comp.menus.group.padding
      value: 2
    shape:
      token: md.comp.menus.group.shape
      role: corner.small
      value: 8
      paints_when: gaps separate the groups
      note: >-
        A group only reads as its own block when a gap sets it apart, and gaps
        are unavailable on web, so this shape has nothing to paint here. Still
        recorded: it is published, and it is the group's.
    label: the optional 32dp section label row
    separator: the divider that sets it apart from the next group
    selection_scope: >-
      One group is one set of checkable rows. Two selectable groups in one menu
      are two independent sets, which is the whole reason selection cannot be a
      property of the menu.
  does_not_own: [ container shape, elevation, inline size, item geometry ]
  roles:
    group: group
    labelled_by: its own label row, which is not focusable
    radiogroup_not_used: >-
      ARIA does not put a `radiogroup` inside a menu. A single-select group is a
      `group` holding `menuitemradio` rows, each carrying `aria-checked`.
    separator: separator
    separator_is_not_hidden: >-
      The first implementation renders a divider as an `aria-hidden` span, which
      drops it out of the accessibility tree entirely. On web the divider is how
      a group is expressed, and the APG names separators as the grouping
      mechanism specifically when a menu holds `menuitemradio` rows. It is a
      `separator`, not focusable and not hidden.
  scroll_box:
    status: the menu list, today
    reason: >-
      Forced by elevation -- an absolutely positioned layer cannot sit inside
      the box that scrolls. It is not an answer to `mutual_exclusion_scope`,
      which stays the owner's.
  api_shape:
    status: composition
    question: Whether a group arrives as data or as composition.
    options:
      data: >-
        `groups={ [ { label, items } ] }`. Closed, terse, and consistent with
        `Tabs`, which takes its tabs as an array.
      composition: >-
        `<Menu.Group label=...><Menu.Item /></Menu.Group>`. Consistent with
        `List` in this app, which takes children and finds its rows by query --
        the same technique `Menu` already uses -- and with both of core's
        menus, which compose.
    chosen: composition
    decision_reason: >-
      Every remaining part of this component nests: a submenu is a menu inside a
      row, and the anatomy has eleven parts of which six are optional slots. A
      data shape turns each into a key and a submenu into data inside data.
      `List` already proves in this codebase that composition and a roving focus
      contract coexist, so the usual objection does not apply here.
    implementation: Menu.Group, Menu.Item and Menu.Separator compose the menu.

# M3's states figure draws six. What each one costs here, and what must not be
# read off the picture.
states:
  published_layers:
    enabled: no layer
    hovered: hover state-layer opacity
    focused: focus state-layer opacity, in addition to the focus indicator
    pressed: pressed state-layer opacity
    disabled: 0.38 on label, icons and supporting text
    active: the row whose submenu is open
  three_opacities_are_three: >-
    The table publishes hover, focus and pressed separately and they are not
    the same number. A single rule serving `:hover` and `:active` at the hover
    opacity is two of the three states missing, not a simplification.
  selected_rows_have_states_too: >-
    The `selected.hovered.*`, `selected.focused.*` and `selected.pressed.*`
    families are published against tertiary-container. A selected row excluded
    from the state layers stops responding to the pointer.
  sibling_precedent:
    where: products/wordpress/themes/axismundi/assets/styles/blocks.navigation-submenu.css
    has: all three opacities, twice for the two colour routes, and again for the selected row
    note: >-
      This repository already solved this once, on core's markup, for the same
      component. The React menu is a parallel implementation rather than a
      port, but there is no reason for it to reach a smaller answer.
  no_per_state_item_shape:
    reading: >-
      The states figure appears to round the hovered and focused rows
      differently. Do not copy that onto a vertical row.
    measured: >-
      The token table publishes six per-state item shapes and all six are
      `md.comp.menus.horizontal.menu-item.*`. For the vertical row it publishes
      none -- only the base shape, the first and last child shapes, and the
      selected shape.
  active_state_blocked_on_submenu:
    status: not_implemented
    reason: >-
      The sixth state is a row whose submenu is open, and the container shape
      morph that goes with it -- `active.container.shape` 16 against
      `inactive.container.shape` 8 -- is the parent menu changing while its
      submenu has focus. Neither exists without submenus, which are deferred.

selection:
  single_select: One item at a time; selecting a new item unselects the previous one.
  multi_select: Many items; the menu stays open until dismissed.
  selected_container_color_role: tertiary-container
  selected_label_text_color_role: on-tertiary-container
  minimum_contrast: "3:1 between selected and unselected items"
  additional_cue_recommended: checkmark
  checked_state_attribute: aria-checked
  checked_state_role: menuitemcheckbox
  checked_state_source: >-
    products/reference-implementations/axismundi-lab/modules/menu/docs/MENU-SPEC-AUDIT.md
    v3.6.16 addendum. Lab evidence, not an M3 statement: M3 publishes the role
    table but not this distinction.
  # Extended while implementing, and the extension is written down rather than
  # made silently. The lab addendum names one checkable role, and the two
  # published selection modes need two: a menu where one row may be checked at a
  # time is a radio group, and `menuitemcheckbox` on it says the rows are
  # independent when they are not. The attribute does not change.
  checked_state_role_by_mode:
    single_select: menuitemradio
    multi_select: menuitemcheckbox
  checked_state_role_extension: >-
    ARIA, not M3 and not the lab. Open to the owner to overrule, in which case
    both modes take `menuitemcheckbox` and this entry says why that was chosen.
  checkability_is_per_group: >-
    An unchecked row in a checkable menu is a checkable row, not a plain menu
    item. Its group decides, so two groups can carry independent selection sets.

focus:
  initial: first menu item
  disabled_items_focusable: true
  disabled_items_selectable: false
  dividers_and_gaps_focusable: false
  restoration: Where focus goes after closing depends on the app.
  exits: [ selecting an option, Escape, a click outside, the system back button ]

keyboard:
  - keys: Tab
    action: Focus lands on menu.
  - keys: Space or Enter
    action: "Closed: opens the menu or submenu. Open: selects a menu item."
  - keys: Up and Down arrows
    action: "Closed: opens the menu. Open: moves focus to the next item."
  - keys: Left and Right arrows
    action: Opens or closes a submenu.
  - keys: Letters
    action: Focus moves to the next menu item starting with that letter.
  - keys: Escape
    action: Closes the menu.

roles:
  menu_item_label: Same text as the menu item.
  role_web: Menu item
  role_android_views: Generic actionable element
  role_compose: Generic actionable element
  icon_in_labelled_item: decorative

placement:
  relative_to: window edge
  default: below, next to, or in front of the element that generates it
  reflow: Repositions left, right or above rather than being cut off.
  submenu: Opens next to the parent item without overlapping it.

adaptive:
  compact:
    guidance: Consider adapting menus into bottom sheets.
    status: owner_judgment_open
    note: >-
      "Consider" is not "must". Dialog's full-screen swap is obligatory because
      M3 writes it as one; this is not, so whether the swap is automatic or a
      caller's choice is a decision, not a reading.
  medium_and_expanded:
    guidance: Menus appear in context with the content, can display more items, and can use submenus.

submenu:
  status: deferred
  available_on:
    web: true
    compose: false
  compose_statement: Submenus are not currently available on Jetpack Compose.
  web_evidence:
    element: md-sub-menu
    anchor_corner_default: start-end
    menu_corner_default: start-start
    source: https://github.com/material-components/material-web/blob/main/docs/components/menu.md
  cost: See `mutual_exclusions` -- a menu that can open a submenu cannot also scroll.

  # The axis, written before the slice is built. Two of these are decisions the
  # first implementation already got wrong once in miniature.
  axis:
    indicator_is_owned_not_passed:
      rule: >-
        A submenu renders its own trailing indicator. A caller cannot pass one,
        and a row without a submenu cannot show one.
      why: >-
        The first stylebook sample passed `arrow_right` as a trailing icon on
        rows that open nothing, which read as a capability this slice does not
        have. The fix was to change the icon, which is a workaround for an API
        that allows the lie. An owned indicator makes it unsayable.
      icon: arrow_right
      icon_source: >-
        The theme's own navigation submenu already uses `arrow_right` for the
        same affordance. `chevron_right` stays with ordinary list disclosure.
    host_mode:
      status: to_be_measured_by_this_slice
      question: Whether the nested host is `popover="manual"` or `popover="auto"`.
      what_is_known: >-
        The reason recorded for `manual` -- that an auto popover closes on any
        click -- is false, measured: a click inside an auto popover leaves it
        open. What `auto` adds is light dismissal, Escape, and a nested popover
        stack, and the stack is only worth anything once a menu opens a menu.
      not_yet_measured: >-
        Light dismissal on a real outside press, and whether an auto submenu
        closes its parent when it opens. Both need a real pointer, which is
        what this slice gives them.
    what_this_slice_settles:
      - placement.block, which is local policy pending runtime measurement
      - mutual_exclusion_scope, which cannot be answered without a submenu to clip
    note: >-
      Building it does not force the exclusion question; it is the only thing
      that can answer it. The three sources describe in-flow submenus and this
      host is in the top layer, so the likely measured answer is that the
      exclusion does not bind here at all.

  # Four sources agree on the inline direction and none publishes a number for
  # the block direction, so the block direction is recorded as a derivation.
  placement:
    inline:
      offset: 0
      anchor: the parent menu's inline end
      agreed_by:
        - { source: M3 guidelines, says: Submenus should open next to the parent menu item without overlapping it. }
        - { source: M3 specs submenu figure, says: The submenu's leading edge meets the parent menu's trailing edge, with no gap drawn. }
        - { source: Material Web, says: "anchor-corner start-end meets menu-corner start-start." }
        - { source: core navigation, says: "A nested submenu container is `left: 100%` of its parent item." }
    block:
      status: local_policy_pending_runtime_measurement
      rule: >-
        Align the submenu's first painted item box with the parent item's
        painted box.
      derivation: offset == -group_padding_block
      derivation_note: >-
        The parent's painted box sits one item inset below its slot; the
        submenu's first painted box sits a group padding and an item inset
        below its container. Aligning the two leaves the group padding.
      recorded_as: local policy, pending measurement
      # Downgraded after review. An earlier version of this entry said the rule
      # above is "what Material Web's corner pair says in our geometry". That
      # was not checked and may be wrong.
      open_question: >-
        What Material Web's `anchor-corner: start-end` anchors to. If it is the
        parent menu container, aligning the painted boxes is a reading of it and
        the derivation may stand. If it is the parent menu item -- which is what
        `md-sub-menu` taking its trigger in an `item` slot suggests -- then the
        submenu container's own top meets the item's top and the offset is 0,
        not minus the group padding.
      not_evidence:
        - >-
          Core's `top: -1px`. Its comment says "Border width" and that is all it
          is: a compensation for an edge this project's submenu does not have.
          It shows that implementations compensate for their container's leading
          edge; it says nothing about group padding.
      settle_by: >-
        Once an adapter exists, measure the `top` of the parent item's painted
        state layer and of the submenu's first painted state layer, and take the
        difference. That is this project's own geometry answering about itself,
        which neither of the two sources above can do.
  hover_bridge:
    status: not_implemented
    source: core navigation
    technique: >-
      A transparent `::before` 0.5em wide on the submenu, reaching back over
      the parent, so a pointer travelling diagonally between rows does not
      leave the menu and close it.
    note: >-
      M3 does not mention it. Recorded because a flush submenu still loses the
      pointer on a diagonal, and this is the fix the repository's own stack
      already ships.
  compact_behaviour:
    core: Nested submenus open accordion-style below their parent instead of to the side.
    m3: Submenus are best on large screens; the adaptive guidance names the alternatives.
    note: Both say the same thing, reached independently. Our compact answer is the open owner judgment under `adaptive.compact`.

# ---------------------------------------------------------------------------
# The host. Menu is not a Surface.
# ---------------------------------------------------------------------------

host:
  element: popover
  not: dialog
  reason: >-
    Surface owns the `<dialog>` host, and its modal axis carries a scrim, a
    scroll lock and inert ancestors. A menu is anchored, non-modal and
    light-dismissed, and a non-modal `dialog.show()` has no light dismiss.
  precedent: products/wordpress/plugins/axismundi-dialogs/assets/tooltip.js
  precedent_notes:
    - Uses `popover = 'manual'`, because an auto popover closes on any click.
    - Feature-detects `popover` and falls back to `<body>`, which is right everywhere except inside a modal dialog.
    - >-
      Measured: the top layer is ordered by when an element joined it, so a
      popover that opened before a `<dialog>` is painted underneath it. Leaving
      and rejoining puts it above whatever is there now. A menu opened from
      inside a dialog has to join after that dialog.
  positioning: >-
    JS measurement with a flip and a viewport-edge clamp, as in the tooltip's
    `place()`. Whether CSS anchor positioning can replace it is a question to
    measure, not to assume.

# ---------------------------------------------------------------------------
# What is not published. Do not fill these in by inference.
# ---------------------------------------------------------------------------

not_published:
  container_inline_size:
    what: minimum and maximum menu width
    note: >-
      Still unpublished. Answered as policy in `project_policy.inline_size`,
      from a measured floor.
  container_block_size:
    what: maximum height, and therefore the point at which a menu starts to scroll
    note: >-
      Still unpublished, and the kit draws its scrollbar statically, so nothing
      measured says when scrolling begins. Answered as policy in
      `project_policy.maximum_height`.
  submenu_offset:
    what: the offset and anchor corners of a submenu relative to its parent item
    note: >-
      Still unpublished as a figure. Answered in `submenu.placement`: the inline
      direction from four agreeing sources, the block direction as a derivation
      from this record's own geometry.
  density:
    what: the web-only density steps that reduce top and bottom padding
    note: >-
      M3 publishes no step value, and the token table carries none. The design
      kit measures one, but only for the row this project does not build -- see
      `design_kit.density`.
  motion:
    what: enter and exit transition tokens
    note: >-
      M3 describes an enter and exit transition relating the menu to its trigger,
      and says dense products may open instantly to reduce motion. The token
      table carries no motion token for this component at all.
  item_insets:
    what: the 2dp vertical and 4dp horizontal padding between the 48dp slot and the 44dp container
    note: Recorded under `item` as measured geometry with its source named.

discrepancies:
  - subject: space between an item's elements
    prose: The kit's painted box sets a horizontal gap of 8, and its trailing group sets 8 again.
    tokens: md.comp.menus.menu-item.between-space resolves to space150, which is 12.
    resolution: >-
      Follow the measurement, reversing this record's first answer. That answer
      was "follow the token, because 8 appears nowhere in the table", and the
      kit's own width arithmetic has since corroborated the 8: a 208dp menu
      less two 4dp insets, two 12dp paddings, a 20dp leading icon and a 20dp
      trailing icon leaves 136, and the text block measures 120, which is 136
      less two gaps of 8. At 12 it would measure 112. The kit means its 8.
      Following the table here would also have been inconsistent with the
      vertical padding below, where the figure whose arithmetic closes is the
      one this record follows.
    observation: >-
      The two disagreements are the same two numbers, swapped. The table
      publishes 12 between and 8 vertical; the kit draws 8 between and 12
      vertical. Recorded as a thing noticed, not as a claim -- if a
      transposition is ever found in one of the two sources, this is the line
      that saves the search.
  - subject: an item's vertical padding
    prose: The kit measures 12 and 12 inside a fixed 44dp box, which fits the 20dp label line exactly.
    tokens: md.comp.menus.menu-item.{top,bottom}-space resolve to space100, which is 8.
    resolution: >-
      Not reconciled, and deliberately so -- see the note on those keys. The
      single-line item is built from the measured 12 because its arithmetic is
      the one that closes against a box the kit actually draws. The token's 8
      stays recorded, unused, and unexplained.
    closed_without_resolving: >-
      The measurement that would have decided it does not exist to be taken.
      The kit draws no two-line menu item, and toggling its hidden supporting
      line inflates the box to 60 rather than producing the 52 the hypothesis
      needs, because the padding is fixed. The token's 8 belongs to something
      neither the kit nor the prose shows.
  - subject: gap
    prose: Gaps are not currently available on web; on web, use a divider.
    tokens: md.comp.menus.gap, md.comp.menus.group.padding and md.comp.menus.group.shape are all live.
    resolution: >-
      The tokens are recorded and the behaviour is not built. A published token
      is not a published platform.
  - subject: item height against the accessibility target
    prose: Targets should be 48x48dp or larger.
    tokens: md.comp.menus.menu-item.height is 44.
    resolution: >-
      Not a conflict. They are different boxes -- 48 is the slot that receives
      the pointer, 44 is the container that receives the state layer, the corner
      radius and the selected colour. 44 + 2 + 2 = 48, and the arithmetic is
      pinned under `item.invariant` rather than the three figures.
  - subject: menu item against list item
    prose: The deprecations send menu items to "standalone list component tokens".
    tokens: md.comp.menus.menu-item.* is live and carries its own height, typescale and shape.
    resolution: >-
      The deprecation retired the old embedded family; the expressive family
      replaced it. Structure follows a list, values do not. See `structure`.

# ---------------------------------------------------------------------------
# Decisions this project makes because nobody published one.
# ---------------------------------------------------------------------------

project_policy:
  maximum_height:
    status: viewport_bound
    rule: A menu must not extend past the window, measured from the space its trigger leaves.
    basis: >-
      This is the only limit M3 actually states. Its placement section is about
      the window edge, and it asks a menu to reposition rather than be cut off;
      nothing published says how many items a menu may show.
    item_count_cap:
      status: not_adopted
      available: true
      expressed_as: container.block_size_formula
      reason: >-
        Choosing a number of items means inventing a constant and then pinning
        it, which is how a defect becomes a contract. Under a viewport bound the
        item count is a consequence rather than a constant. The cap stays
        described so it can be switched on when something asks for a shorter
        menu, and the formula is already verified at four and six items.
  inline_size:
    status: floor_from_measurement
    rule: Take the kit's 208 as a minimum, let the menu grow to its content, and clamp it to the window.
    basis: >-
      M3 publishes neither a minimum nor a maximum, and the lab's own audit
      names its baseline primitive as the authority -- which is the lab's
      stylesheet, not a specification. One instance of one kit is evidence for a
      floor, not for a fixed width.
    window_clamp: true
    window_clamp_basis: >-
      Taken from this product's own navigation submenu, which already clamps to
      the viewport less a gutter at each side. The height policy is bound to the
      window for M3's stated reason; a width that is not would still run off it.
    sibling_precedent:
      where: products/wordpress/themes/axismundi/assets/styles/blocks.navigation-submenu.css
      minimum: 112
      maximum: 280
      sizing: max-content between those bounds
      disagrees: true
      note: >-
        The block's floor is 112 where this record's is 208, and the block caps
        at 280 where this does not cap at all. Not reconciled: the block's
        figures were chosen for navigation labels, which are short, and the
        kit's 208 is a drawing of a menu. Recorded so the difference is a
        decision somebody made rather than a drift nobody noticed, and so a
        later shared answer has both numbers in front of it.

token_families:
  implemented_now:
    - md.comp.menus.container.{elevation,shape}
    - md.comp.menus.{active,inactive}.container.shape
    - md.comp.menus.menu-item.*
    - md.comp.menus.standard.*
  deferred_with_contract:
    - md.comp.menus.vibrant.*
  recorded_not_implemented:
    - md.comp.menu.container.*
    - md.comp.menus.horizontal.*
    - md.comp.menus.{gap,group.padding,group.shape}

# ---------------------------------------------------------------------------
# What the design kit shows that the table and the prose do not. Read through
# the Figma connector, file ixQuHzVDPis0DYdaoMixyP, Menu page 55141:14250.
# ---------------------------------------------------------------------------

design_kit:
  file: ixQuHzVDPis0DYdaoMixyP
  page: "55141:14250"
  # The horizontal run, at layer coordinates rather than by arithmetic. Every
  # boundary lands, which is what settles the 8dp gap against the table's 12.
  horizontal_run:
    state_layer_inline_size: 200
    leading_at: 12
    content_at: 40
    content_ends: 160
    trailing_at: 168
    trailing_ends: 188
    content_at_without_leading: 12
    content_inline_size_without_leading: 176
  density:
    status: baseline_row_only
    step: -8
    unit: dp per item per step
    measured:
      - { subject: Menu list item building block, steps: [ 0, -2, -4 ], heights: [ 73, 65, 57 ] }
      - { subject: Menu (baseline) with twelve items, steps: [ 0, -2, -4 ], heights: [ 688, 592, 496 ] }
    note: >-
      The expressive section draws no density variant at all. Recorded because
      it is the only measured value this project has for density, and recorded
      as belonging to the baseline row so that nobody applies it to the one
      being built.
  baseline_leading_icon_size: 24
  baseline_leading_icon_note: >-
    The baseline section's leading element is 24dp where the expressive one is
    20dp, which corroborates the published expressive icon size from a second
    direction.
  item_states:
    - Enabled
    - Hovered
    - Focused
    - Pressed
    - Disabled
    - Active
  item_states_note: >-
    Each is drawn for Selected false and true except Active, which the kit draws
    unselected only. Eleven symbols per theme.
  vibrant:
    status: fully_drawn
    note: >-
      The kit carries a complete Vibrant item set alongside Standard, and
      Vibrant variants of the menu at one, two and three groups. So deferring
      vibrant is this project's choice and not a gap in the source.
  artifacts:
    - subject: divider width
      observed: Every divider instance is 220dp wide at x=4 inside a 208dp item, and every one is hidden.
      reading: >-
        Consistent across every instance rather than a one-off, which reads as a
        component that was never resized rather than an intended bleed. Not
        recorded as a contract.

evidence_not_product:
  lab_module: products/reference-implementations/axismundi-lab/modules/menu
  lab_provider: products/reference-implementations/axismundi-lab/modules/popover
  reason: >-
    The lab built a Menu module as a consumer of its popover runtime and drew
    the boundary this record keeps -- Menu owns item semantics and authoring
    structure, the popover provider owns anchoring, open and close, outside
    dismissal, Escape, focus restoration and placement. It is lab evidence, not
    a shipped implementation, and its measurements derive from its own baseline
    primitive rather than from M3.
  block_precedent:
    - products/wordpress/themes/axismundi/assets/styles/blocks.navigation-submenu.css
    - products/wordpress/plugins/axismundi-navigation-icons/assets/navigation.css
  block_precedent_note: >-
    Core's navigation submenu is already an M3 Menu in this theme's own words,
    nested popovers included. It is the nearest place this repository has
    already solved placement and nesting on real markup.
