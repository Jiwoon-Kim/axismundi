  url: /foundations/
  summary: 토큰, 색, 타이포그래피, 모양, 상태

- section: components
  label: Components
  url: /components/
  summary: 컴포넌트별 Material 사양과 구현 기준

- section: wordpress
  label: WordPress Bindings
  url: /wordpress/
  summary: core 블록과 Material 컴포넌트의 대응 관계
