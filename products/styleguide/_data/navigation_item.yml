# Material 3 Navigation item — the published specification.
#
# Sources: https://m3.material.io/components/navigation-bar/specs
#          https://m3.material.io/components/navigation-bar/guidelines
#          https://m3.material.io/components/navigation-bar/accessibility
#          https://m3.material.io/components/navigation-rail/specs
#
# Token names and their referenced sys roles are read from each host's own token
# table with `tools/generators/fetch_m3_component_tokens.py`. The full tables are
# recorded in
# `products/wordpress/plugins/axismundi/docs/SOURCE-M3-NAVIGATION-RAW.md`.
#
# WHY THIS FILE EXISTS. M3 publishes no `navigation item` component. The item's
# tokens live inside its two hosts, `md.comp.nav-bar.item.*` and
# `md.comp.nav-rail.item.*`, and those two sets are not the same set. The shape
# of the difference is the contract:
#
#   colour and state  identical, role for role      -> the item owns them
#   vertical geometry identical, figure for figure  -> the item owns it, as default
#   horizontal geometry  diverges                   -> the host supplies it
#
# An item that hardcoded an indicator height or a label typescale would be right
# in the bar and wrong in the rail. That is the whole reason to specify the item
# before either host.
#
# Each host also publishes a deprecated baseline namespace in the same table
# (`md.comp.navigation-bar.*`, `md.comp.navigation-rail.*`). Nothing here reads
# from those; see `discrepancies`.
#
# NOT `navigation.yml`, which is this site's own chrome.

meta:
  published_as_its_own_component: false
  hosts: [ nav-bar, nav-rail ]
  # Identical in both hosts, so the item owns them outright.
  icon_size_tokens:
    - md.comp.nav-bar.item.icon.size
    - md.comp.nav-rail.item.icon.size
  icon_size: 24
  indicator_shape_tokens:
    - md.comp.nav-bar.item.active-indicator.shape
    - md.comp.nav-rail.item.active-indicator.shape
  indicator_shape_role: corner.full
  # Every leading/trailing row either host publishes is space200 -- the bar's
  # horizontal pair, the rail's unqualified pair, its vertical pair and its
  # horizontal full-width pair. One figure across both hosts, so by the same test
  # as the vertical geometry it is the item's, not the host's. It is the space
  # inside the indicator, before the icon and after the label.
  indicator_leading_trailing_space_role: space200
  # The vertical inset inside the item container, above the indicator and below
  # the label. Both hosts publish it at the same figure under different names, so
  # by the same test as the vertical geometry it is the item's.
  vertical_container_space_tokens:
    - md.comp.nav-bar.item.vertical.container.between-space
    - md.comp.nav-rail.item.container.vertical-space
  vertical_container_space_role: space75
  # MEASURED IN THE DESIGN KIT, because the bar's name for it reads like a gap
  # between items and was implemented as one. A vertical item is 104x64 in both
  # hosts, with the 56x32 indicator at y=6 and the 16dp label ending at y=58:
  # 6 + 32 + 4 + 16 + 6 = 64, which is each host's published container height.
  # It is applied as padding, not as a computed centre, because both
  # accessibility pages ask the item to grow for larger labels "while retaining
  # the default padding".
  vertical_container_space_source: figma-design-kit
  # One destination is always active. Not a style rule -- the active indicator is
  # the only thing telling someone where they are.
  exactly_one_active: true

# Anatomy, from the bar's Anatomy section. The rail's item carries the same parts.
anatomy: [ container, icon, label_text, active_indicator, small_badge, large_badge ]

# TWO BOXES, NOT ONE. This distinction is first in the file because losing it
# produced three separate errors in this component, each of which read as a
# plausible figure at the time:
#
#   - `item.vertical.container.between-space` was implemented as a gap BETWEEN
#     items, when it is padding INSIDE the item container;
#   - a horizontal item container was left at its content width, so 24dp of a
#     64dp bar stopped responding to a press;
#   - the Specs sentence "Horizontal navigation items have a fixed width" was
#     read as a statement about the indicator, which conveniently removed the
#     need for a figure nobody publishes.
#
# Figma names them apart -- an item instance of 116.2x64 holding an "Icon
# container" of 92x40 -- and so does the measurements page. So does this file.
structure:
  item_container:
    # The interactive target. It is the element that carries `href`, the state
    # layer's hit area, and the focus ring.
    role: the outer target a person presses
    element: a
    class: ax-navigation-item
    # Always the host's full item height; never hugged to the indicator.
    fills_host_item_height: true
    # Its WIDTH is the host's arithmetic, and the hosts differ -- see
    # `navigation_bar.yml` and `navigation_rail.yml`. Not published here.
    width_owned_by: host
  active_indicator:
    # The pill. Purely visual: it paints the selected state and the state layer
    # colour, and it is not the target.
    role: the pill drawn inside the container
    class: ax-navigation-item__indicator
    # Vertical is a fixed 56x32 box; horizontal is the host's height around
    # content width.
    width_owned_by: item_when_vertical
  # Which box the label sits in is the structural difference between the two
  # orientations, and the reason they cannot share one DOM.
  label_inside_indicator:
    vertical: false
    horizontal: true

# OWNED BY THE ITEM. Every one of these rows matches across both hosts, role for
# role, which is what makes a shared primitive correct rather than convenient.
colors:
  active:
    icon_role: on-secondary-container
    indicator_role: secondary-container
    label_text_role: secondary
  inactive:
    icon_role: on-surface-variant
    label_text_role: on-surface-variant
  # "Use a filled icon for the active destination and outlined icons for
  # inactive destinations." Guidance with no token of its own; the icon's fill
  # axis carries it.
  active_icon_fill: 1
  # The active label's emphasis. OUR POLICY, NOT A PUBLISHED FIGURE -- see
  # `discrepancies`. Written directly in the `axismundi.theme` layer rather than
  # tokenised: it is one axis of one typeface for one state of one component, and
  # a shared token would claim a reusable typography primitive that does not
  # exist.
  active_label_emphasis_axis: GRAD
  active_label_emphasis_value: 125
  active_label_emphasis_source: local-policy
  active_label_emphasis_layer: axismundi.theme
  # Measured 2026-10-05: `label-medium` resolves to 500 in this app, so the
  # active and inactive labels compute the same weight and no weight is applied
  # on top. The grade is the whole of the difference.
  active_label_weight_applied: false
  # All four combinations -- active and inactive, hovered, focused and pressed --
  # reference the same role in both hosts.
  state_layer_role: on-secondary-container

states:
  - name: enabled
  - name: hovered
    opacity_token: md.sys.state.hover.state-layer-opacity
  - name: focused
    opacity_token: md.sys.state.focus.state-layer-opacity
  - name: pressed
    opacity_token: md.sys.state.pressed.state-layer-opacity

# OBSERVED, NOT INVENTED. Both hosts publish the three opacity rows only under
# `item.active.*`. The inactive rows carry a state-layer colour and no opacity of
# their own, so the same sys opacities apply; nothing publishes a different
# figure for the inactive state.
inactive_state_layer_opacity_is_republished: false

orientations:
  - name: vertical
    title: Vertical
    # Label below the icon and the indicator. Default, and the shared case: every
    # vertical figure below is identical in nav-bar and nav-rail.
    shared_across_hosts: true
    indicator_height: 32
    indicator_width: 56
    icon_label_space_role: space50
    label_typescale: label-medium
    tokens:
      indicator_height:
        - md.comp.nav-bar.item.vertical.active-indicator.height
        - md.comp.nav-rail.item.vertical.active-indicator.height
      indicator_width:
        - md.comp.nav-bar.item.vertical.active-indicator.width
        - md.comp.nav-rail.item.vertical.active-indicator.width
      icon_label_space:
        - md.comp.nav-bar.item.vertical.active-indicator.icon-label-space
        - md.comp.nav-rail.item.vertical.icon-label-space
      label_text_font:
        - md.comp.nav-bar.item.vertical.label-text.font
        - md.comp.nav-rail.item.vertical.label-text.font
  - name: horizontal
    title: Horizontal
    # Icon and label beside each other inside the indicator. This is where the
    # hosts diverge, and the figures are not close: the rail's indicator is 16dp
    # taller and its label is a larger typescale.
    shared_across_hosts: false
    by_host:
      nav-bar:
        indicator_height: 40
        icon_label_space_role: space50
        label_typescale: label-medium
        tokens:
          indicator_height: md.comp.nav-bar.item.horizontal.active-indicator.height
          icon_label_space: md.comp.nav-bar.item.horizontal.active-indicator.icon-label-space
          label_text_font: md.comp.nav-bar.item.horizontal.label-text.font
      nav-rail:
        indicator_height: 56
        icon_label_space_role: space100
        label_typescale: label-large
        tokens:
          indicator_height: md.comp.nav-rail.item.horizontal.active-indicator.height
          icon_label_space: md.comp.nav-rail.item.horizontal.icon-label-space
          label_text_font: md.comp.nav-rail.item.horizontal.label-text.font

# PUBLISHED, BUT NOT THE ITEM'S. These belong to whichever host is arranging the
# items. An item that shipped them would make its own stacking and spacing rules,
# which is the host's job -- the same ownership split `divider.yml` records for
# surrounding margins.
owned_by_host:
  nav_bar:
    # The gap between item boxes, which the design kit measures as zero in both
    # orientations. `item.vertical.container.between-space` used to be listed
    # here as a second, larger gap; it is not a gap at all, and it has moved to
    # `meta.vertical_container_space_role` as the item's own padding.
    item_between_space_role: space0
  nav_rail:
    # The rail gives its item a container height; the bar does not publish one.
    item_container_height: 64
    item_short_container_height: 56
    item_container_shape_role: corner.none
    # The rail reserves a region above the first item, for a menu button or FAB.
    header_space_minimum_role: space500

semantics:
  # Each item navigates to a destination, so it is a link, not a button. The
  # active one is current rather than pressed.
  element: a
  # Not a prop choice. `DECISION-FRONTEND-NAVIGATION-MODEL.md` already decided
  # that the React app preserves a real anchor URL and that the router enhances
  # an unmodified primary click, so there is no `onClick`-only item to build.
  href_required: true
  # See `discrepancies`. The published row says Space selects; an anchor does not,
  # and this records that the divergence is a decision.
  space_activates: false
  active_attribute: aria-current
  active_attribute_value: page
  # "Initial focus lands directly on the first navigation item, since that is the
  # first interactive element of the component."
  initial_focus: first_item
  # Published as Tab, not arrow keys -- so each item stays in the tab order and
  # no roving tabindex is introduced. Recorded because the opposite was assumed
  # once already, for the button group.
  keyboard:
    - keys: Tab
      action: Move between navigation items
    - keys: Space or Enter
      action: Selects the focused navigation item

usage:
  - a label is required on every item, and it should be 1-2 words
  - use a filled icon for the active destination and outlined icons for the rest
  - do not wrap, truncate or shrink the label to fit one line
  - use the active indicator for exactly one destination at a time
  # Accessibility, text scaling: the host grows to fit rather than the label
  # shrinking, and the full label must stay visible to 2x.
  - let the host grow vertically for scaled text; wrapping inside an item is allowed

discrepancies:
  - token: md.comp.nav-bar.item.active-indicator.icon-label-space
    prose: >-
      The orientation-independent icon-label row reads as a single figure for the
      item.
    tokens: >-
      The two hosts disagree on it. The bar publishes a literal 4dp, the rail
      references md.sys.measurement.space100. Their orientation-qualified rows
      agree with neither pattern: both hosts use space50 for vertical.
    note: >-
      So the unqualified row is host-specific, not item-specific, and the
      orientation-qualified rows are the ones to implement. The item takes the
      space from its host's qualified token and publishes no default of its own.
  - token: active label weight
    prose: >-
      "Use a filled icon with a bold label for selected destinations. For
      unselected destinations use an outlined icon with a medium label."
    tokens: >-
      Neither flexible namespace publishes a label weight at all. The only
      weight token is md.comp.navigation-bar.active.label-text.weight in the
      deprecated baseline namespace, and it references
      md.sys.typescale.label-medium.weight.prominent, which the same table marks
      deprecated: "No longer in user. Please use emphasized token instead."
    note: >-
      The requirement is published only in prose and its token chain is dead at
      both ends, so the emphasis is implemented as a typeface AXIS and recorded as
      this project's policy rather than as a published figure: GRAD 125, written
      in the `axismundi.theme` layer of `navigation-item.css`, which sits after
      `components` so that a reader of the component layer is not left guessing
      which rules came from the specification. It is not tokenised -- one axis of
      one typeface for one state of one component is not a typography primitive,
      and naming it `emphasized` at the ref tier claimed that it was.
      WHY NO TOKEN CAN CARRY IT. The two Google properties that implement this
      emphasis choose different axes for it, because they set different
      typefaces: m3.material.io's own sidebar uses font-weight 500 with "GRAD"
      125 on its active label, and fonts.google.com's rail uses font-weight 600
      with "ROND" 100. Neither is a specification -- both are that site's own
      chrome, not a rendered specimen of the component -- but together they are
      good evidence that the axis is a property of the typeface, which is exactly
      what a component token cannot name. Ours is Roboto Flex, whose axes include
      GRAD and do not include ROND, so ROND could not be copied even if we wanted
      it; GRAD 125 is also what this project's own block theme already does on its
      current navigation item.
      WEIGHT IS NOT PART OF IT HERE. `label-medium` in this app already resolves
      to 500, so the active and inactive labels compute the same weight and
      declaring one would emphasise nothing. Measured 2026-10-05.
      THE EARLIER RECORD WAS WRONG BY OMISSION, not by fact. This file and
      `navigation-item.css` described the theme's own `500 + GRAD 125` as a local
      decision the published chain does not support. The second half is still
      true; the first half implied the theme had invented it, when it is the same
      choice Google's own navigation makes. The replacement `emphasized` typescale
      token still has to be read from the typescale tables, and if it turns out to
      carry this emphasis it replaces the policy.
  - token: keyboard activation with Space
    prose: >-
      The accessibility table publishes two rows: "Tab -- Move between navigation
      items" and "Space / Enter -- Selects the focused navigation item".
    tokens: >-
      No token publishes keyboard behaviour at all; this is prose only, and the
      table is complete -- it was read from the page rather than from a
      transcription.
    note: >-
      NON-STANDARD against M3, deliberately. The item is an anchor, because
      navigation here is link-first, and on the web an anchor is activated by
      Enter while Space scrolls the page. The published row is true of a
      button-like widget, which is what a navigation item is on Android, iOS and
      Flutter. Implementing it would produce a control that announces as a link
      and behaves as a button, and would take page scrolling away from a keyboard
      user whose focus is in the navigation. Recorded rather than quietly
      dropped, and pinned by the validator so it is not "fixed" by someone
      reading the table alone.
  - token: badge
    prose: >-
      Anatomy lists a small badge and a large badge with its label as optional
      item parts.
    tokens: >-
      No live badge token exists in either flexible namespace; the baseline
      namespaces carry badge.color, badge.shape, badge.size and the large-badge
      trio, and the table marks all of them deprecated. The page says "For badge
      color roles, go to badge specs."
    note: >-
      Badge is its own component. The item declares the slot and its position --
      upper right corner of the icon -- and spends none of the badge's figures.

# Deliberately absent, so absence is not read as an oversight.
not_published_here:
  # No token publishes it; the bar's measurements prose says vertical items
  # divide the container equally and horizontal items take a fixed width with the
  # slack pushed to the ends. Both are the host's arithmetic.
  - item width
  # Prose only: "If an icon doesn't have a filled version, apply semibold weight
  # to the icon instead." Whether we can is a property of the icon font's axes,
  # not of this component.
  - icon fill and weight fallback
  # See `discrepancies`.
  - active label weight
  - badge geometry
  # The rail reserves the space; what goes in it is the rail's decision.
  - rail header content
