figma_kit_structure:
  status: implemented
  source: "Material 3 Design Kit (Community), Navigation Rail and Navigation Rail: Expanded"
  read: 2026-10-14
  two_components_not_one: >-
    The kit draws the collapsed rail and the expanded rail as separate
    components with different nested instances: the collapsed one nests a FAB,
    the expanded one nests an extended FAB. This record and the implementation
    treat expansion as a variant of one rail, which is still the right shape for
    the web -- but it means the header's contents change with the variant, not
    only its width.
  collapsed:
    container_width: 96
    header_group: Menu & Fab
    header_order: [ icon_button, fab ]
    header_content: { icon_button_block: 56, fab_block: 56, spacing: 4, computed_block: 116 }
  expanded:
    container_width: 220
    implementation_width: >-
      The kit's 220dp component is the implemented default. The published 360dp
      maximum remains a bound, not a responsive `width: 100%` policy: no source
      says when this app should grow the rail inside that range.
    type_axis: [ Docked, Floating ]
    floating_middle_observation: >-
      The kit's Floating / Middle / three-item variant uses surface-container-low.
      No expanded floating specimen is present in the available kit material, and
      this app exposes no Docked/Floating API. This is evidence for the later
      axis decision, not a reason to make the current `filled` boolean mean
      Floating.
    modal_observation: >-
      The kit's separate Expanded layout is modal-looking, but the supplied
      frames do not establish which breakpoint or app-bar scenario selects it.
      Do not infer a mobile side sheet from that visual alone.
    header_group: Menu & Fab
    header_order: [ icon_button, extended_fab ]
    header_content: { inline: 180, icon_button_block: 56, extended_fab_block: 56, spacing: 4, computed_block: 116 }
    padding: { inline: 20, block_start: 44, block_end: 20 }
    header_to_segments_spacing: 40
    segments_width: 180
    section_header:
      inline: 180
      block: 36
      padding_inline: 16
      gap: 10
      text_color_role: on-surface-variant
    segments_are_sectioned: >-
      Not a flat list: Section 1 to 3, with the section-header geometry above
      and 12dp between sections.
  what_the_implementation_does_instead: >-
    `NavigationRail` now renders a Menu and Fab group, chooses `collapsedFab`
    or `expandedFab` with the variant, renders the menu button above its FAB, and
    lets the 56 + 4 + 56 header size naturally. It accepts optional sections and
    intentionally still has no Docked/Floating
    axis. The kit draws two components while this app keeps one variant-driven
    component; that remains a web-shape decision, not a claim that the kit is
    wrong.
  owner: >-
    This belongs to the navigation rail's next slice, not to the FAB. The FAB is
    a nested instance here; nothing above is a property of the FAB.

not_published_here:
  # "Destinations in the navigation rail should remain visible and fixed when
  # scrolling vertically." The rail does not own the scroll container.
  - sticky behaviour on scroll
  # "If a layout scrolls horizontally, the rail can scroll off-screen or remain
  # fixed." Published as a choice, not a rule.
  - behaviour when the layout scrolls horizontally
  # "Tabs can be used alongside a navigation rail." A composition note.
  - tabs beside the rail
  # "The top of the rail can also be used for a logo, however avoid using logos
  # that could be mistaken as buttons." That is the caller's content in the menu
  # or FAB slot.
  - logo placement
  - badge geometry
